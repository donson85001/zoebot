<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zoebot 贈訂跑馬燈測試</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  background:#151821;
  color:#fff;
  font-family:Arial,'Noto Sans TC','Microsoft JhengHei',sans-serif;
}
.page{padding:24px;display:flex;gap:24px;align-items:flex-start;flex-wrap:wrap}
.controls{
  width:330px;
  background:#20242f;
  border:1px solid #383e4d;
  border-radius:16px;
  padding:18px;
}
h1{font-size:23px;margin:0 0 8px}
.note{font-size:13px;color:#aeb4c2;line-height:1.55;margin-bottom:14px}
label{display:block;margin:12px 0 6px;color:#cdd2dc;font-size:14px}
input{width:100%;height:42px;border-radius:9px;border:1px solid #454c5e;background:#11141c;color:white;padding:0 11px;font-size:17px}
.buttons{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
button{height:40px;border:0;border-radius:9px;background:#ef629a;color:#fff;font-weight:800;cursor:pointer}
button.low{background:#485063}
button.high{background:#a97816}
button.wide{grid-column:1/-1}
#status{margin-top:14px;font-size:14px;color:#ffd5e5;line-height:1.5}
.preview-area{display:flex;flex-direction:column;gap:8px}
.preview-title{font-size:14px;color:#c4c9d4;max-width:630px;line-height:1.5}
.preview-box{
  width:630px;
  height:510px;
  position:relative;
  background:transparent;
  overflow:hidden;
  border:1px dashed #545b6d;
}
#preview{width:630px;height:510px;border:0;display:block;background:transparent}
@media(max-width:1050px){.page{padding:14px}.controls{width:100%;max-width:630px}.preview-box{max-width:100%}}
</style>
</head>
<body>
<div class="page">
  <section class="controls">
    <h1>跑馬燈測試</h1>
    <div class="note">平常右邊就是原本的 <b>obs-overlay.html</b> 位置與大小。只有收到 50 份以上時，原畫面才往下推一次，頂部露出跑馬燈；連續贈訂會一直維持在下面，不會每一筆又下移一次。</div>

    <label for="name">贈訂者名稱</label>
    <input id="name" value="調皮0123">

    <label for="count">贈訂份數</label>
    <input id="count" type="number" value="50" min="1">

    <div class="buttons">
      <button class="low" data-count="5">5</button>
      <button class="low" data-count="10">10</button>
      <button data-count="50">50</button>
      <button data-count="80">80</button>
      <button class="high" data-count="100">100</button>
      <button class="high" data-count="150">150</button>
      <button class="high" data-count="200">200</button>
      <button id="custom">自訂</button>
      <button id="sequence" class="wide">連續測試 50 → 100 → 150 → 200</button>
    </div>
    <div id="status">待命中</div>
  </section>

  <section class="preview-area">
    <div class="preview-title">平常：原本 630 × 420 畫面貼在最上方。觸發時：整張原畫面只往下推一次，上方出現跑馬燈；全部排隊播完才回原位。</div>
    <div class="preview-box">
      <iframe id="preview" src="gift-marquee-obs-test.html" scrolling="no" title="OBS 計數器加跑馬燈測試"></iframe>
    </div>
  </section>
</div>
<script>
(() => {
  const preview=document.getElementById('preview');
  const name=document.getElementById('name');
  const count=document.getElementById('count');
  const status=document.getElementById('status');

  function send(v){
    const c=Math.max(0,Math.floor(Number(v)||0));
    const who=name.value.trim()||'匿名';
    count.value=c;
    preview.contentWindow?.postMessage({type:'zoebot-gift-marquee',name:who,count:c},'*');
    if(c<50) status.textContent=`${c} 份：不觸發跑馬燈`;
    else status.textContent=`已測試：${who} / ${c} 份`;
  }

  document.querySelectorAll('[data-count]').forEach(b=>b.addEventListener('click',()=>send(b.dataset.count)));
  document.getElementById('custom').addEventListener('click',()=>send(count.value));
  document.getElementById('sequence').addEventListener('click',()=>{
    [50,100,150,200].forEach((v,i)=>setTimeout(()=>send(v),i*220));
    status.textContent='已送入 50 → 100 → 150 → 200 排隊測試；畫面只會下移一次';
  });
  count.addEventListener('keydown',e=>{if(e.key==='Enter')send(count.value)});
})();
</script>
</body>
</html>
