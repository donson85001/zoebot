<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zoebot 贈訂跑馬燈測試台</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  background:#12131a;
  color:#f7f7fb;
  font-family:Arial,'Noto Sans TC','Microsoft JhengHei',sans-serif;
}
.page{max-width:1120px;margin:0 auto;padding:28px}
h1{margin:0 0 8px;font-size:30px}
.sub{color:#a9adba;margin-bottom:22px;line-height:1.6}
.grid{display:grid;grid-template-columns:360px 1fr;gap:28px;align-items:start}
.panel{
  background:#1d202a;
  border:1px solid #343846;
  border-radius:18px;
  padding:20px;
  box-shadow:0 18px 40px rgba(0,0,0,.25);
}
label{display:block;font-size:14px;color:#b8bdca;margin:14px 0 7px}
input{
  width:100%;
  height:44px;
  border-radius:10px;
  border:1px solid #3d4354;
  background:#141721;
  color:#fff;
  padding:0 12px;
  font-size:18px;
}
.buttons{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:14px}
button{
  border:0;
  border-radius:10px;
  min-height:42px;
  padding:8px 10px;
  font-weight:800;
  cursor:pointer;
  background:#f0639d;
  color:white;
  font-size:15px;
}
button:hover{filter:brightness(1.08)}
button.alt{background:#42485a}
button.gold{background:#b88922}
button.wide{grid-column:1/-1}
.rule{
  margin-top:18px;
  padding:14px;
  background:#151822;
  border-radius:12px;
  line-height:1.65;
  color:#d3d7e2;
}
.rule strong{color:white}
#status{margin-top:14px;min-height:24px;color:#ffd7e7;line-height:1.5}
.preview-col{display:flex;flex-direction:column;align-items:center;gap:12px}
.preview-title{width:630px;color:#cdd2df;font-size:14px;line-height:1.6}
.preview-shell{
  width:630px;
  height:510px;
  position:relative;
  overflow:hidden;
  background:transparent;
}
#preview{
  width:630px;
  height:510px;
  border:0;
  display:block;
  background:transparent;
}
.note{width:630px;color:#9298a8;font-size:13px;line-height:1.65}
@media(max-width:1050px){
  .grid{grid-template-columns:1fr}
  .panel{max-width:630px;margin:0 auto}
  .page{padding:16px}
}
</style>
</head>
<body>
<div class="page">
  <h1>贈訂跑馬燈測試台</h1>
  <div class="sub">右邊直接使用現在正式的「累積豬叫 / 海豹拍」OBS 畫面，所以底下那張圖、數字位置、尺寸都跟現行版本一樣。跑馬燈只放在那張圖的正上方，不做全畫面特效。</div>

  <div class="grid">
    <section class="panel">
      <label for="name">贈訂者名稱</label>
      <input id="name" value="調皮0123" autocomplete="off">

      <label for="count">贈訂份數</label>
      <input id="count" type="number" min="1" step="1" value="50">

      <div class="buttons">
        <button class="alt" data-count="5">5 份</button>
        <button class="alt" data-count="10">10 份</button>
        <button data-count="50">50 份</button>
        <button data-count="80">80 份</button>
        <button class="gold" data-count="100">100 份</button>
        <button class="gold" data-count="150">150 份</button>
        <button class="gold" data-count="200">200 份</button>
        <button id="custom">自訂播放</button>
        <button id="sequence" class="wide">連續測試：50 → 100 → 150 → 200</button>
      </div>

      <div class="rule">
        <strong>目前規則</strong><br>
        1～49：不顯示<br>
        50～99：一般跑馬燈<br>
        100：089457<br>
        150：香港13太飽<br>
        200+：全場起飛<br>
        多筆：排隊逐筆播放
      </div>
      <div id="status">待命中</div>
    </section>

    <section class="preview-col">
      <div class="preview-title">OBS 實際尺寸預覽：630 × 420 的現行畫面，跑馬燈額外佔上方 90px。</div>
      <div class="preview-shell">
        <iframe id="preview" src="gift-marquee-obs-test.html" title="現行 OBS 畫面 + 跑馬燈測試"></iframe>
      </div>
      <div class="note">這個測試頁不會寫入試算表，也不會動到正式 `obs-overlay.html`。底下計數畫面是直接載入正式 OBS 頁面，所以會顯示目前真正的累積數字。</div>
    </section>
  </div>
</div>
<script>
(() => {
  const name=document.getElementById('name');
  const count=document.getElementById('count');
  const preview=document.getElementById('preview');
  const status=document.getElementById('status');

  function send(n){
    const c=Math.max(0,Math.floor(Number(n)||0));
    const who=name.value.trim()||'匿名';
    count.value=c;
    preview.contentWindow?.postMessage({type:'zoebot-gift-marquee',name:who,count:c},'*');
    if(c<50)status.textContent=`${who} ${c} 份：低於 50，不顯示。`;
    else if(c===100)status.textContent=`${who} 100 份 → 089457`;
    else if(c===150)status.textContent=`${who} 150 份 → 香港13太飽`;
    else if(c>=200)status.textContent=`${who} ${c} 份 → 全場起飛`;
    else status.textContent=`${who} ${c} 份 → 一般跑馬燈`;
  }

  document.querySelectorAll('[data-count]').forEach(btn=>btn.addEventListener('click',()=>send(btn.dataset.count)));
  document.getElementById('custom').addEventListener('click',()=>send(count.value));
  document.getElementById('sequence').addEventListener('click',()=>{
    [50,100,150,200].forEach((v,i)=>setTimeout(()=>send(v),i*250));
    status.textContent='已塞入 50 / 100 / 150 / 200，會照順序排隊播放。';
  });
  count.addEventListener('keydown',e=>{if(e.key==='Enter')send(count.value)});
})();
</script>
</body>
</html>
