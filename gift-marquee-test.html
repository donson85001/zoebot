<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zoebot 贈訂跑馬燈測試</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#151821;color:#fff;font-family:Arial,'Noto Sans TC','Microsoft JhengHei',sans-serif}
.page{padding:24px;display:flex;gap:24px;align-items:flex-start;flex-wrap:wrap}
.controls{width:470px;background:#20242f;border:1px solid #383e4d;border-radius:16px;padding:18px}
h1{font-size:23px;margin:0 0 8px}.note{font-size:13px;color:#aeb4c2;line-height:1.55;margin-bottom:14px}
label{display:block;margin:12px 0 6px;color:#cdd2dc;font-size:14px}
input{width:100%;height:42px;border-radius:9px;border:1px solid #454c5e;background:#11141c;color:white;padding:0 11px;font-size:17px}
.tier{margin-top:13px;padding:12px;border:1px solid #3a4050;border-radius:12px;background:#191d26}.tier-title{font-weight:900;margin-bottom:8px}.buttons{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
button{min-height:42px;border:0;border-radius:9px;background:#ef629a;color:#fff;font-weight:800;cursor:pointer;padding:6px 7px;line-height:1.2}button.v2{background:#8c57dc}button.v3{background:#4e7fc9}button.auto{background:#a97816}button.wide{width:100%;margin-top:10px;background:#485063}
#status{margin-top:14px;font-size:14px;color:#ffd5e5;line-height:1.5;min-height:22px}
.preview-area{display:flex;flex-direction:column;gap:8px}.preview-title{font-size:14px;color:#c4c9d4;max-width:630px;line-height:1.5}
.preview-box{width:630px;height:476px;position:relative;background:#171a22;overflow:visible;border:1px dashed #545b6d}
#preview{width:630px;height:476px;border:0;display:block;background:transparent}
.legend{font-size:13px;color:#ff9eaa;max-width:630px;line-height:1.55}
@media(max-width:1160px){.page{padding:14px}.controls{width:100%;max-width:630px}.preview-box{max-width:100%}}
</style>
</head>
<body>
<div class="page">
  <section class="controls">
    <h1>跑馬燈 1 / 2 / 3 測試</h1>
    <div class="note">每個訂閱檔位都有自己獨立的 1 → 2 → 3 順序。按「自動下一個」就是模擬真正贈訂；同一檔位第一次播 1、第二次播 2、第三次播 3、第四次回 1。編號 2 / 3 使用新 520 影片並保留音訊。</div>
    <label for="name">贈訂者名稱</label><input id="name" value="調皮0123">

    <div class="tier">
      <div class="tier-title">50 訂閱</div>
      <div class="buttons">
        <button data-count="50" data-variant="1" data-label="水">1 水</button>
        <button class="v2" data-count="50" data-variant="2" data-label="Conan">2 Conan</button>
        <button class="v3" data-count="50" data-variant="3" data-label="shark">3 shark</button>
        <button class="auto" data-count="50" data-label="自動下一個">自動下一個</button>
      </div>
    </div>

    <div class="tier">
      <div class="tier-title">100 訂閱</div>
      <div class="buttons">
        <button data-count="100" data-variant="1" data-label="蛋塔">1 蛋塔</button>
        <button class="v2" data-count="100" data-variant="2" data-label="SLAM-DUNK">2 SLAM</button>
        <button class="v3" data-count="100" data-variant="3" data-label="baseball">3 baseball</button>
        <button class="auto" data-count="100" data-label="自動下一個">自動下一個</button>
      </div>
    </div>

    <div class="tier">
      <div class="tier-title">150 訂閱</div>
      <div class="buttons">
        <button data-count="150" data-variant="1" data-label="檸檬">1 檸檬</button>
        <button class="v2" data-count="150" data-variant="2" data-label="02">2 02</button>
        <button class="v3" data-count="150" data-variant="3" data-label="facechange">3 facechange</button>
        <button class="auto" data-count="150" data-label="自動下一個">自動下一個</button>
      </div>
    </div>

    <div class="tier">
      <div class="tier-title">200+ 訂閱</div>
      <div class="buttons">
        <button data-count="200" data-variant="1" data-label="cel">1 cel</button>
        <button class="v2" data-count="200" data-variant="2" data-label="up">2 up</button>
        <button class="v3" data-count="200" data-variant="3" data-label="necklace">3 necklace</button>
        <button class="auto" data-count="200" data-label="自動下一個">自動下一個</button>
      </div>
    </div>

    <button id="reset" class="wide">重置四個檔位的順序，下一次都從 1 開始</button>
    <div id="status">載入測試畫面中…</div>
  </section>

  <section class="preview-area">
    <div class="preview-title"><b>紅色虛線就是實際 630×420 的底線。</b> 測試版會一次預載全部 12 支影片。</div>
    <div class="preview-box"><iframe id="preview" scrolling="no" allow="autoplay" title="固定 630x420 裁切檢視"></iframe></div>
    <div class="legend">正式使用時紅線以下完全看不到；目前只改測試頁，正式版尚未加入編號 2 / 3。</div>
  </section>
</div>
<script>
(() => {
  const preview=document.getElementById('preview'),name=document.getElementById('name'),status=document.getElementById('status');
  let previewReady=false;const pending=[];
  function post(payload){if(!previewReady){pending.push(payload);return}preview.contentWindow?.postMessage(payload,'*')}
  function flush(){while(pending.length)preview.contentWindow?.postMessage(pending.shift(),'*')}
  preview.addEventListener('load',()=>{previewReady=true;flush();status.textContent='待命中；四個檔位的自動順序目前都是編號 1'});
  preview.src='gift-marquee-obs-test.html?debug=1&_='+Date.now();
  function sendButton(btn){
    const count=Number(btn.dataset.count),variant=Number(btn.dataset.variant)||0,who=name.value.trim()||'匿名',label=btn.dataset.label||'';
    const payload={type:'zoebot-gift-marquee',name:who,count};if(variant)payload.variant=variant;post(payload);
    status.textContent=variant?`已送出：${count} 訂閱 / 編號 ${variant} / ${label}`:`已送出：${count} 訂閱 / 自動下一個（此檔位依 1 → 2 → 3 輪替）`;
  }
  document.querySelectorAll('[data-count]').forEach(btn=>btn.addEventListener('click',()=>sendButton(btn)));
  document.getElementById('reset').addEventListener('click',()=>{post({type:'zoebot-gift-marquee-reset'});status.textContent='已重置：50 / 100 / 150 / 200 下一次自動播放都從編號 1 開始'});
})();
</script>
</body>
</html>
