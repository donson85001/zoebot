<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zoebot OBS 跑馬燈測試版</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:630px;height:420px;overflow:hidden;background:transparent;font-family:Arial,'Noto Sans TC','Microsoft JhengHei',sans-serif}
#stage{position:relative;width:630px;height:420px;overflow:hidden;background:transparent}
#marqueeSlot{position:absolute;left:0;top:0;width:630px;height:168px;overflow:hidden;z-index:3;pointer-events:none}
#banner{position:absolute;left:0;top:0;width:630px;height:162px;border-radius:24px;overflow:hidden;opacity:0;transform:translateX(-650px);transition:transform .42s cubic-bezier(.2,.9,.25,1),opacity .25s ease;filter:drop-shadow(0 8px 14px rgba(0,0,0,.22))}
#banner.show{opacity:1;transform:translateX(0)}
#banner.mode50{background:linear-gradient(90deg,#ef6598,#f79bc0 52%,#ef6598);border:5px solid rgba(255,255,255,.96);box-shadow:inset 0 1px 0 rgba(255,255,255,.28)}
#banner.mode100{background:linear-gradient(100deg,#d94f72 0%,#f07fa1 38%,#ffd56b 62%,#ec7099 100%);border:5px solid #fff3bd;box-shadow:inset 0 0 20px rgba(255,255,255,.22)}
#banner.mode150{background:linear-gradient(100deg,#70207f 0%,#b9328b 32%,#f04f9c 58%,#8b2b99 100%);border:5px solid #ffd6f0;box-shadow:inset 0 0 24px rgba(255,255,255,.18)}
#banner.mode200{background:linear-gradient(100deg,#25133f 0%,#5c2679 30%,#d34794 58%,#f5b63a 100%);border:5px solid #ffe28a;box-shadow:inset 0 0 28px rgba(255,230,155,.16)}
#shine{position:absolute;inset:0;background:linear-gradient(115deg,transparent 0 38%,rgba(255,255,255,.28) 45%,transparent 52%);transform:translateX(-125%)}
#banner.shine-now #shine{animation:shine 1.1s ease-out 1}
@keyframes shine{to{transform:translateX(125%)}}
#badge{position:absolute;left:18px;top:37px;width:102px;height:88px;border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:2;border:2px solid rgba(255,255,255,.92);box-shadow:0 4px 12px rgba(100,20,55,.12),inset 0 1px 0 #fff;transition:background .2s ease,color .2s ease}
.mode50 #badge{background:linear-gradient(180deg,#fff,#fff7fb);color:#be2d66}
.mode100 #badge{background:linear-gradient(180deg,#fff7c7,#fffdf0 62%,#fff);color:#a06400}
.mode150 #badge{background:linear-gradient(180deg,#ffeaf7,#fff 65%);color:#7d2678}
.mode200 #badge{background:linear-gradient(180deg,#fff0ac,#fff8d9 58%,#fff);color:#6f3e00}
#badgeIcon{font-size:23px;line-height:1;margin-bottom:7px;filter:drop-shadow(0 1px 1px rgba(0,0,0,.08))}
#badgeValueRow{display:flex;align-items:flex-end;justify-content:center;gap:4px;line-height:1;max-width:90px;white-space:nowrap}
#badgeCount{font-size:29px;line-height:.92;font-weight:900;letter-spacing:-1.2px}
#badgeUnit{font-size:13px;line-height:1;font-weight:900;margin-bottom:2px;letter-spacing:.2px}
#lane{position:absolute;left:132px;right:18px;top:0;height:100%;overflow:hidden;display:flex;align-items:center}
#text{position:absolute;left:100%;white-space:nowrap;font-size:60px;line-height:1.02;font-weight:900;letter-spacing:.2px;color:#fff;text-shadow:0 4px 10px rgba(60,0,30,.34);will-change:transform}
#counterPanel{position:absolute;left:0;top:0;width:630px;height:420px;background:url('WF拍肚.png') 0 0 / 630px 420px no-repeat;transform:translateY(0);transition:transform .55s cubic-bezier(.22,.78,.24,1);will-change:transform}
#stage.active #counterPanel{transform:translateY(56px)}
.num{position:absolute;width:102px;height:54px;display:flex;align-items:center;justify-content:center;background:transparent;border:0;box-shadow:none;color:#d94f72;font-weight:800;font-size:38px;line-height:1;letter-spacing:0;text-shadow:none;white-space:nowrap}
#months{left:464px;top:198px}
#gifts{left:464px;top:278px}
.tierMedia{position:absolute;left:12px;top:168px;width:252px;height:252px;overflow:hidden;border-radius:18px;display:block;opacity:0;z-index:2;pointer-events:none;box-shadow:0 6px 18px rgba(0,0,0,.22);transition:opacity .06s linear}
.tierMedia.show{opacity:1}
.tierMedia video{width:100%;height:100%;object-fit:cover;transform:scale(1.12);transform-origin:center center;display:block}
#cropLine,#cropLabel{display:none}
body.debug{height:476px;overflow:visible;background:#171a22}
body.debug #stage{height:476px;overflow:visible;background:rgba(0,0,0,.06)}
body.debug #cropLine{display:block;position:absolute;left:0;top:419px;width:630px;border-top:3px dashed #ff4d67;z-index:10;pointer-events:none}
body.debug #cropLabel{display:block;position:absolute;right:8px;top:424px;padding:4px 8px;border-radius:6px;background:#ff4d67;color:#fff;font-size:13px;font-weight:900;z-index:11;pointer-events:none}
body.debug::after{content:'實際 OBS 只到紅線，上面 630×420；紅線下方就是被裁掉的 56px';position:absolute;left:8px;top:446px;color:#ff9eaa;font-size:12px;font-weight:700;z-index:12}
</style>
</head>
<body>
<div id="stage">
  <div id="counterPanel"><div id="months" class="num">0</div><div id="gifts" class="num">0</div></div>
  <div id="marqueeSlot">
    <div id="banner">
      <div id="shine"></div>
      <div id="badge"><div id="badgeIcon">🎁</div><div id="badgeValueRow"><span id="badgeCount">50</span><span id="badgeUnit">贈</span></div></div>
      <div id="lane"><div id="text"></div></div>
    </div>
  </div>

  <div class="tierMedia" data-tier="50" data-variant="1"><video src="seal.mp4?v=fa7babdabdcd" playsinline preload="none"></video></div>
  <div class="tierMedia" data-tier="50" data-variant="2"><video src="Conan-520.mp4?v=32ffb0869107" playsinline preload="none"></video></div>
  <div class="tierMedia" data-tier="50" data-variant="3"><video src="sir.mp4?v=c973d0301c79" playsinline preload="none"></video></div>
  <div class="tierMedia" data-tier="50" data-variant="4"><video src="0725.mp4?v=72fb7c5cc455" playsinline preload="none"></video></div>

  <div class="tierMedia" data-tier="100" data-variant="1"><video src="boy.mp4?v=2b043d08d737" playsinline preload="none"></video></div>
  <div class="tierMedia" data-tier="100" data-variant="2"><video src="SLAM-DUNK-520.mp4?v=9b1ab08a5c23" playsinline preload="none"></video></div>
  <div class="tierMedia" data-tier="100" data-variant="3"><video src="baseball-520.mp4?v=833e68c70c39" playsinline preload="none"></video></div>
  <div class="tierMedia" data-tier="100" data-variant="4"><video src="love.mp4?v=2522c09e7b36" playsinline preload="none"></video></div>

  <div class="tierMedia" data-tier="150" data-variant="1"><video src="0859457.mp4?v=1d53ab12fe18" playsinline preload="none"></video></div>
  <div class="tierMedia" data-tier="150" data-variant="2"><video src="02-520.mp4?v=93fcd7ca1b74" playsinline preload="none"></video></div>
  <div class="tierMedia" data-tier="150" data-variant="3"><video src="facechange-520.mp4?v=c741fa297cc7" playsinline preload="none"></video></div>
  <div class="tierMedia" data-tier="150" data-variant="4"><video src="shark-520.mp4?v=21b272496d21" playsinline preload="none"></video></div>

  <div class="tierMedia" data-tier="200" data-variant="1"><video src="lemon.mp4?v=3fde48d7f5a7" playsinline preload="none"></video></div>
  <div class="tierMedia" data-tier="200" data-variant="2"><video src="up-520.mp4?v=a6da404f2f61" playsinline preload="none"></video></div>
  <div class="tierMedia" data-tier="200" data-variant="3"><video src="ni.mp4?v=c6b4e1d69667" playsinline preload="none"></video></div>
  <div class="tierMedia" data-tier="200" data-variant="4"><video src="kokain.mp4?v=307b80fe072f" playsinline preload="none"></video></div>

  <div id="cropLine"></div><div id="cropLabel">↓ 被裁掉 56px</div>
</div>
<script>
(() => {
  const params=new URLSearchParams(location.search);
  if(params.get('debug')==='1')document.body.classList.add('debug');
  const MIN_GIFT=50;
  const stage=document.getElementById('stage'),banner=document.getElementById('banner'),badgeIcon=document.getElementById('badgeIcon'),badgeCount=document.getElementById('badgeCount'),lane=document.getElementById('lane'),text=document.getElementById('text'),months=document.getElementById('months'),gifts=document.getElementById('gifts');
  const queue=[];let playing=false,activeEntry=null;const sleep=ms=>new Promise(r=>setTimeout(r,ms));
  const nextVariant={50:1,100:1,150:1,200:1};
  const superSequence=[];[50,100,150,200].forEach(count=>{for(let variant=1;variant<=4;variant++)superSequence.push({count,variant})});
  let superLoopActive=false,superLoopIndex=0,superLoopName='匿名';
  function queueSuperNext(){if(!superLoopActive)return;const item=superSequence[superLoopIndex];superLoopIndex=(superLoopIndex+1)%superSequence.length;queue.push({name:superLoopName,count:item.count,variant:item.variant,eventId:'',mediaAlt:''})}
  const entries=[...document.querySelectorAll('.tierMedia')].map(media=>({media,video:media.querySelector('video'),tier:Number(media.dataset.tier),variant:Number(media.dataset.variant),alt:String(media.dataset.alt||''),muted:media.dataset.muted==='1',blobPromise:null,blobUrl:null,sourceUrl:media.querySelector('video').getAttribute('src')}));
  const entryKey=e=>`${e.tier}:${e.variant}${e.alt?':'+e.alt:''}`;
  const entryMap=new Map(entries.map(e=>[entryKey(e),e]));
  const tierForCount=count=>count>=200?200:count>=150?150:count>=100?100:50;
  const entryFor=(count,variant)=>entryMap.get(`${tierForCount(count)}:${variant}`)||null;
  const criticalKeys=new Set(['50:1','200:1']);
  const keyOf=entryKey;
  function preloadEntries(list){list.forEach(e=>{e.video.preload='auto';e.video.volume=1;try{e.video.load()}catch(_){}})}
  async function ensureCriticalBlob(entry){
    if(!criticalKeys.has(keyOf(entry)))return;
    if(entry.blobPromise)return entry.blobPromise;
    entry.blobPromise=(async()=>{
      try{
        const r=await fetch(entry.sourceUrl,{cache:'no-store'});
        if(!r.ok)throw new Error(`HTTP ${r.status}`);
        const blob=await r.blob();
        if(entry.blobUrl)URL.revokeObjectURL(entry.blobUrl);
        entry.blobUrl=URL.createObjectURL(blob);
        entry.video.src=entry.blobUrl;
        entry.video.preload='auto';
        entry.video.load();
        await new Promise(resolve=>{
          if(entry.video.readyState>=3)return resolve();
          let done=false;const finish=()=>{if(done)return;done=true;entry.video.removeEventListener('canplay',finish);clearTimeout(timer);resolve()};
          const timer=setTimeout(finish,3000);entry.video.addEventListener('canplay',finish,{once:true});
        });
      }catch(e){
        console.error('critical blob preload failed',keyOf(entry),e);
        entry.video.src=entry.sourceUrl;entry.video.preload='auto';try{entry.video.load()}catch(_){}
      }
    })();
    return entry.blobPromise;
  }
  const celEntry=entryMap.get('200:1'),waterEntry=entryMap.get('50:1');
  if(celEntry)ensureCriticalBlob(celEntry);
  if(waterEntry)setTimeout(()=>ensureCriticalBlob(waterEntry),250);
  setTimeout(()=>preloadEntries(entries.filter(e=>e.variant===1&&!criticalKeys.has(keyOf(e)))),700);
  setTimeout(()=>preloadEntries(entries.filter(e=>e.variant===2)),1400);
  setTimeout(()=>preloadEntries(entries.filter(e=>e.variant===3)),2400);
  setTimeout(()=>preloadEntries(entries.filter(e=>e.variant===4)),3200);
  const COUNTER_API='https://script.google.com/macros/s/AKfycbzLet29KonFvVjhxrzf7oM-g-FyfhVkyzYjbRLQtrHeX7zh4KLNXsIbfRdqGnYZuWzzZg/exec?action=stats';
  async function updateCounters(){try{const r=await fetch(COUNTER_API+'&_='+Date.now(),{cache:'no-store'}),d=await r.json();if(d&&d.ok!==false){const m=Number(d.subscriptionMonths),g=Number(d.giftSubCount);if(Number.isFinite(m))months.textContent=String(Math.trunc(m));if(Number.isFinite(g))gifts.textContent=String(Math.trunc(g))}}catch(e){console.error(e)}}
  updateCounters();setInterval(updateCounters,5000);
  function waitUntilPlayable(video,timeout=1200){if(video.readyState>=3)return Promise.resolve();return new Promise(resolve=>{let done=false;const finish=()=>{if(done)return;done=true;video.removeEventListener('canplay',finish);clearTimeout(timer);resolve()};const timer=setTimeout(finish,timeout);video.addEventListener('canplay',finish,{once:true})})}
  function fullyBuffered(video){
    const d=Number(video.duration);if(!Number.isFinite(d)||d<=0||!video.buffered?.length)return false;
    for(let i=0;i<video.buffered.length;i++){if(video.buffered.start(i)<=.15&&video.buffered.end(i)>=d-.25)return true}
    return false;
  }
  const safelyBuffered=video=>video.src.startsWith('blob:')||video.readyState>=4||fullyBuffered(video);
  function waitUntilSafe(entry,timeout=8000){
    const video=entry.video;
    if(!criticalKeys.has(keyOf(entry)))return waitUntilPlayable(video);
    if(safelyBuffered(video))return Promise.resolve();
    return new Promise(resolve=>{let done=false;const events=['progress','canplaythrough','durationchange','loadeddata'];const cleanup=()=>{events.forEach(x=>video.removeEventListener(x,check));clearInterval(poll);clearTimeout(timer)};const finish=()=>{if(done)return;done=true;cleanup();resolve()};const check=()=>{if(safelyBuffered(video))finish()};events.forEach(x=>video.addEventListener(x,check));const poll=setInterval(check,120);const timer=setTimeout(finish,timeout)})
  }
  function waitForRenderedFrame(video,timeout=450){if(typeof video.requestVideoFrameCallback==='function')return new Promise(resolve=>{let done=false;const finish=()=>{if(done)return;done=true;clearTimeout(timer);resolve()};const timer=setTimeout(finish,timeout);video.requestVideoFrameCallback(finish)});return new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)))}
  function resetVideo(video){video.pause();video.muted=true;try{video.currentTime=0}catch(_){}}
  async function switchMedia(entry){
    const {media,video,muted}=entry;
    await ensureCriticalBlob(entry);
    video.preload='auto';if(video.readyState===0){try{video.load()}catch(_){}}
    await waitUntilSafe(entry);
    if(activeEntry===entry){resetVideo(video);try{await video.play()}catch(e){console.error(e)}await waitForRenderedFrame(video);video.muted=muted;return}
    resetVideo(video);try{await video.play()}catch(e){console.error(e)}await waitForRenderedFrame(video);
    const old=activeEntry;media.classList.add('show');activeEntry=entry;
    if(old&&old!==entry){old.media.classList.remove('show');resetVideo(old.video)}
    video.muted=muted;
  }
  function hideActive(){if(!activeEntry)return;activeEntry.media.classList.remove('show');resetVideo(activeEntry.video);activeEntry=null}
  function normalize(p){return{name:String(p?.name||p?.who||'匿名').trim()||'匿名',count:Math.max(0,Math.floor(Number(p?.count??p?.total??0)||0)),variant:Number(p?.variant)||0,mediaAlt:String(p?.mediaAlt||'')}}
  function modeFor(count){if(count>=200)return'mode200';if(count>=150)return'mode150';if(count>=100)return'mode100';return'mode50'}
  function iconFor(count){if(count>=200)return'🔥';if(count>=150)return'👑';if(count>=100)return'⭐';return'🎁'}
  function messageFor({name,count,variant,mediaAlt}){
    const pats=Math.floor(count/5),tier=tierForCount(count);
    if(variant===4){
      if(tier===50)return`感謝 ${name} 的 ${count}份贈訂！才藝表演跳舞：Trouble Maker - '내일은 없어 (Now)'！海豹拍肚 +${pats}！`;
      if(tier===100)return`肉乙好想知道${name}的${count}份會給怎樣的人！從不養戀愛粉恩罵~!海豹拍肚 +${pats}！`;
      if(tier===150)return`${name} 逼肉乙去鏟 ${count}包薯條！我鏟不鏟薯條到底關你屁事啊！海豹拍肚 +${pats}！`;
      return`感謝 ${name} 的 ${count}份贈訂！才藝表演跳舞：kokain！海豹拍肚 +${pats}！`;
    }
    if(variant===2){
      if(tier===50)return`感謝 ${name} 的 ${count}份贈訂！才藝表演卡祖笛：名偵探柯南！海豹拍肚 +${pats}！`;
      if(tier===100)return`感謝 ${name} 的 ${count}份贈訂！才藝表演卡祖笛：灌籃高手！海豹拍肚 +${pats}！`;
      if(tier===150)return`感謝 ${name} 的 ${count}份贈訂！才藝表演跳舞：02搖！海豹拍肚 +${pats}！`;
      return`感謝 ${name} 的 ${count}份贈訂！才藝表演跳舞：UP！跟著一起跳起來！海豹拍肚 +${pats}！`;
    }
    if(variant===3){
      if(tier===50)return`感謝 ${name} 的 ${count}份贈訂！發瘋喇！完全惡意剪輯！海豹拍肚 +${pats}！`;
      if(tier===100)return`${name}同學被肉乙甩棒 ${count}次！發瘋啦！嚴厲斥責！海豹拍肚 +${pats}！`;
      if(tier===150)return`${name} 聽不懂肉乙講話 ${count}次！MD欠扁484啊！海豹拍肚 +${pats}！`;
      if(tier===200)return`感謝 ${name} 的 ${count}份贈訂！才藝表演唱歌：關於cmonBruh的歌！海豹拍肚 +${pats}！`;
    }
    if(count>=200)return`肉乙把 ${name} 丟地板了 ${count}次！我就把你布置好的東西全部弄掉！海豹拍肚 +${pats}！`;
    if(count>=150)return`肉乙從不畏懼 ${name} 的 ${count}訂閱！狗叫什麼啊破皮的屁孩！海豹拍肚 +${pats}！`;
    if(count>=100)return`肉乙跟 ${name} 一起泡泡浴了 ${count}次！果然只有男人最懂男人！海豹拍肚 +${pats}！`;
    return`感謝 ${name} 的 ${count}份贈訂！才藝表演：海豹拍！海豹拍肚 +${pats}！`;
  }
  function setLook(item){const mode=modeFor(item.count);banner.classList.remove('mode50','mode100','mode150','mode200','shine-now');banner.classList.add(mode);badgeIcon.textContent=iconFor(item.count);badgeCount.textContent=String(item.count);text.textContent=messageFor(item);void banner.offsetWidth;banner.classList.add('shine-now')}
  const variantOrder={50:[1,2,3,4],100:[1,2,3,4],150:[1,2,3,4],200:[1,2,3,4]};function chooseVariant(item){if(item.variant>=1&&item.variant<=4)return item.variant;const tier=tierForCount(item.count),order=variantOrder[tier],v=nextVariant[tier],i=Math.max(0,order.indexOf(v));nextVariant[tier]=order[(i+1)%order.length];return v}
  function durationFor(item,entry,distance){
    const pxPerSecond=item.count<100?188:172,natural=Math.max(item.count<100?6.8:7.2,distance/pxPerSecond),video=entry.video,clip=Number(video.duration),current=Math.max(0,Number(video.currentTime)||0),remaining=Number.isFinite(clip)&&clip>0?Math.max(0,clip-current):0;
    return Math.max(natural,remaining+.2);
  }
  function waitForVideoFinish(video){
    if(!video||video.ended)return Promise.resolve();
    return new Promise(resolve=>{
      let done=false,poll=0,timer=0;
      const cleanup=()=>{video.removeEventListener('ended',finish);video.removeEventListener('error',finish);clearInterval(poll);clearTimeout(timer)};
      const finish=()=>{if(done)return;done=true;cleanup();resolve()};
      const check=()=>{const d=Number(video.duration),t=Number(video.currentTime);if(video.ended||(Number.isFinite(d)&&d>0&&Number.isFinite(t)&&t>=d-.04))finish()};
      video.addEventListener('ended',finish,{once:true});video.addEventListener('error',finish,{once:true});
      poll=setInterval(check,100);const d=Number(video.duration);timer=setTimeout(finish,Number.isFinite(d)&&d>0?Math.min(90000,Math.max(10000,(d+15)*1000)):45000);check();
    });
  }
  async function playOne(item){
    const entry=entryFor(item.count,item.variant);if(!entry)return;await switchMedia(entry);setLook(item);
    text.style.transition='none';text.style.transform='translateX(0)';await sleep(70);
    const distance=lane.clientWidth+text.scrollWidth+54,duration=durationFor(item,entry,distance),videoDone=waitForVideoFinish(entry.video);
    text.style.transition=`transform ${duration}s linear`;requestAnimationFrame(()=>requestAnimationFrame(()=>text.style.transform=`translateX(-${distance}px)`));
    await Promise.all([sleep(duration*1000),videoDone]);
    if(!queue.length)hideActive();
  }
  async function drain(){if(playing)return;playing=true;stage.classList.add('active');await sleep(580);if(queue.length)setLook(queue[0]);banner.classList.add('show');await sleep(430);while(true){while(queue.length){await playOne(queue.shift());await sleep(100);if(superLoopActive&&!queue.length)queueSuperNext()}await sleep(420);if(queue.length)continue;break}hideActive();banner.classList.remove('show');await sleep(420);stage.classList.remove('active');await sleep(580);playing=false;if(queue.length)drain()}
  function enqueue(payload){const item=normalize(payload);if(item.count<MIN_GIFT)return{accepted:false,reason:'below-threshold'};item.variant=chooseVariant(item);if(!entryFor(item.count,item.variant))return{accepted:false,reason:'empty-slot'};queue.push(item);drain();return{accepted:true,tier:tierForCount(item.count),variant:item.variant}}
  function resetVariants(){nextVariant[50]=1;nextVariant[100]=1;nextVariant[150]=1;nextVariant[200]=1;superLoopIndex=0;return{...nextVariant}}
  function startSuperLoop(payload={}){superLoopName=String(payload.name||'匿名').trim()||'匿名';superLoopActive=true;superLoopIndex=0;queue.length=0;queueSuperNext();drain();return{active:true}}
  function stopSuperLoop(){superLoopActive=false;queue.length=0;return{active:false}}
  window.ZoeGiftMarquee={enqueue,getQueue:()=>queue.slice(),isPlaying:()=>playing,resetVariants,getNextVariants:()=>({...nextVariant}),startSuperLoop,stopSuperLoop};
  window.addEventListener('message',e=>{if(e?.data?.type==='zoebot-gift-marquee')enqueue(e.data);else if(e?.data?.type==='zoebot-gift-marquee-reset'){superLoopActive=false;queue.length=0;resetVariants()}else if(e?.data?.type==='zoebot-super-loop-start')startSuperLoop(e.data);else if(e?.data?.type==='zoebot-super-loop-stop')stopSuperLoop()});
  if(params.has('count'))setTimeout(()=>enqueue({name:params.get('name')||'測試觀眾',count:params.get('count'),variant:params.get('variant')}),450);
})();
