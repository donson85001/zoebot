<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zoebot OBS 跑馬燈測試版</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:630px;height:420px;overflow:hidden;background:transparent;font-family:Arial,'Noto Sans TC','Microsoft JhengHei',sans-serif}
#stage{position:relative;width:630px;height:420px;overflow:hidden;background:transparent}
#marqueeSlot{position:absolute;left:0;top:0;width:630px;height:168px;overflow:hidden;z-index:3;pointer-events:none}
#banner{position:absolute;left:0;top:0;width:630px;height:162px;border-radius:26px;overflow:hidden;opacity:0;transform:translateX(-650px);transition:transform .42s cubic-bezier(.2,.9,.25,1),opacity .25s ease;filter:drop-shadow(0 10px 18px rgba(0,0,0,.28))}
#banner.show{opacity:1;transform:translateX(0)}
#banner.standard{background:linear-gradient(90deg,rgba(255,103,157,.97),rgba(255,180,210,.97),rgba(255,103,157,.97));border:6px solid rgba(255,255,255,.95)}
#banner.deluxe{background:linear-gradient(100deg,#7c258d,#ed4f99 31%,#ffd04d 55%,#ed4f99 80%,#7c258d);border:6px solid #fff0a2;box-shadow:inset 0 0 26px rgba(255,255,255,.24)}
#shine{position:absolute;inset:0;background:linear-gradient(115deg,transparent 0 38%,rgba(255,255,255,.34) 45%,transparent 52%);transform:translateX(-125%)}
#banner.shine-now #shine{animation:shine 1.1s ease-out 1}@keyframes shine{to{transform:translateX(125%)}}
#badge{position:absolute;left:18px;top:33px;height:96px;min-width:180px;padding:0 22px;border-radius:22px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.96);color:#c62f6b;font-size:34px;font-weight:900;white-space:nowrap;z-index:2}
.deluxe #badge{color:#8c2872;background:linear-gradient(180deg,#fff5b6,#fff)}
#lane{position:absolute;left:215px;right:18px;top:0;height:100%;overflow:hidden;display:flex;align-items:center}
#text{position:absolute;left:100%;white-space:nowrap;font-size:48px;line-height:1;font-weight:900;color:#fff;text-shadow:0 4px 12px rgba(80,0,35,.38);will-change:transform}
#counterFrame{position:absolute;left:0;top:0;width:630px;height:420px;border:0;margin:0;padding:0;background:transparent;transform:translateY(0);transition:transform .55s cubic-bezier(.22,.78,.24,1);will-change:transform}
#stage.active #counterFrame{transform:translateY(56px)}
#cropLine,#cropLabel{display:none}
body.debug{height:476px;overflow:visible;background:#171a22}
body.debug #stage{height:476px;overflow:visible;background:rgba(0,0,0,.06)}
body.debug #cropLine{display:block;position:absolute;left:0;top:419px;width:630px;border-top:3px dashed #ff4d67;z-index:10;pointer-events:none}
body.debug #cropLabel{display:block;position:absolute;right:8px;top:424px;padding:4px 8px;border-radius:6px;background:#ff4d67;color:#fff;font-size:13px;font-weight:900;z-index:11;pointer-events:none}
body.debug::after{content:'實際 OBS 只到紅線，上面 630×420；紅線下方就是被裁掉的 56px';position:absolute;left:8px;top:446px;color:#ff9eaa;font-size:12px;font-weight:700;z-index:12}
</style>
</head>
<body>
<div id="stage">
  <div id="marqueeSlot"><div id="banner"><div id="shine"></div><div id="badge">🎁 50 贈</div><div id="lane"><div id="text"></div></div></div></div>
  <iframe id="counterFrame" src="obs-overlay.html" scrolling="no" title="現行累積豬叫與海豹拍"></iframe>
  <div id="cropLine"></div><div id="cropLabel">↓ 被裁掉 56px</div>
</div>
<script>
(() => {
  const params=new URLSearchParams(location.search);
  if(params.get('debug')==='1')document.body.classList.add('debug');
  const MIN_GIFT=50,DELUXE_GIFT=100;
  const stage=document.getElementById('stage'),banner=document.getElementById('banner'),badge=document.getElementById('badge'),lane=document.getElementById('lane'),text=document.getElementById('text');
  const queue=[];let playing=false;const sleep=ms=>new Promise(r=>setTimeout(r,ms));
  function normalize(p){return{name:String(p?.name||p?.who||'匿名').trim()||'匿名',count:Math.max(0,Math.floor(Number(p?.count??p?.total??0)||0))}}
  function specialText(count){if(count===100)return'089457';if(count===150)return'香港13太飽';if(count>=200)return'全場起飛';return''}
  function messageFor({name,count}){const pats=Math.floor(count/5),special=specialText(count);return count>=DELUXE_GIFT?`🔥 ${name} 豪擲 ${count} 份訂閱！${special?special+'！':''}海豹拍肚 +${pats} 🔥`:`🎁 ${name} 贈送 ${count} 份訂閱！海豹拍肚 +${pats}！`}
  function setLook(item){const deluxe=item.count>=DELUXE_GIFT;banner.classList.remove('standard','deluxe','shine-now');banner.classList.add(deluxe?'deluxe':'standard');badge.textContent=deluxe?`👑 ${item.count} 贈`:`🎁 ${item.count} 贈`;text.textContent=messageFor(item);void banner.offsetWidth;banner.classList.add('shine-now')}
  async function playOne(item){setLook(item);text.style.transition='none';text.style.transform='translateX(0)';await sleep(70);const distance=lane.clientWidth+text.scrollWidth+40,deluxe=item.count>=DELUXE_GIFT,pxPerSecond=deluxe?230:255,duration=Math.max(deluxe?6.2:5.4,distance/pxPerSecond);text.style.transition=`transform ${duration}s linear`;requestAnimationFrame(()=>requestAnimationFrame(()=>text.style.transform=`translateX(-${distance}px)`));await sleep(duration*1000)}
  async function drain(){if(playing)return;playing=true;stage.classList.add('active');await sleep(580);banner.classList.add('show');await sleep(430);while(true){while(queue.length){await playOne(queue.shift());await sleep(100)}await sleep(420);if(queue.length)continue;break}banner.classList.remove('show');await sleep(420);stage.classList.remove('active');await sleep(580);playing=false;if(queue.length)drain()}
  function enqueue(payload){const item=normalize(payload);if(item.count<MIN_GIFT)return{accepted:false,reason:'below-threshold'};queue.push(item);drain();return{accepted:true}}
  window.ZoeGiftMarquee={enqueue,getQueue:()=>queue.slice(),isPlaying:()=>playing};
  window.addEventListener('message',e=>{if(e?.data?.type==='zoebot-gift-marquee')enqueue(e.data)});
  if(params.has('count'))setTimeout(()=>enqueue({name:params.get('name')||'測試觀眾',count:params.get('count')}),450);
})();
</script>
</body>
</html>
