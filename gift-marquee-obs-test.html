<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zoebot OBS 跑馬燈測試版</title>
<style>
*{box-sizing:border-box}
html,body{
  margin:0;
  padding:0;
  width:630px;
  height:420px;
  overflow:hidden;
  background:transparent;
  font-family:Arial,'Noto Sans TC','Microsoft JhengHei',sans-serif;
}
#stage{position:relative;width:630px;height:420px;overflow:hidden}
#marqueeSlot{
  position:absolute;
  left:0;
  top:0;
  width:630px;
  height:56px;
  overflow:hidden;
  z-index:3;
  pointer-events:none;
}
#banner{
  position:absolute;
  left:0;
  top:0;
  width:630px;
  height:54px;
  overflow:hidden;
  opacity:0;
  transform:translateX(-650px);
  transition:transform .42s cubic-bezier(.2,.9,.25,1),opacity .22s ease;
  filter:drop-shadow(0 5px 10px rgba(0,0,0,.28));
}
#banner.show{opacity:1;transform:translateX(0)}
#banner.standard{
  background:linear-gradient(90deg,rgba(255,103,157,.97),rgba(255,180,210,.97),rgba(255,103,157,.97));
  border:3px solid rgba(255,255,255,.95);
}
#banner.deluxe{
  background:linear-gradient(100deg,#7c258d,#ed4f99 31%,#ffd04d 55%,#ed4f99 80%,#7c258d);
  border:3px solid #fff0a2;
  box-shadow:inset 0 0 14px rgba(255,255,255,.22);
}
#shine{position:absolute;inset:0;background:linear-gradient(115deg,transparent 0 38%,rgba(255,255,255,.34) 45%,transparent 52%);transform:translateX(-125%)}
#banner.shine-now #shine{animation:shine 1.15s ease-out 1}
@keyframes shine{to{transform:translateX(125%)}}
#badge{
  position:absolute;
  left:8px;
  top:7px;
  height:36px;
  min-width:94px;
  padding:0 10px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(255,255,255,.96);
  color:#c62f6b;
  font-size:17px;
  font-weight:900;
  white-space:nowrap;
  z-index:2;
}
.deluxe #badge{color:#8c2872;background:linear-gradient(180deg,#fff5b6,#fff)}
#lane{position:absolute;left:112px;right:8px;top:0;height:100%;overflow:hidden;display:flex;align-items:center}
#text{
  position:absolute;
  left:100%;
  white-space:nowrap;
  font-size:22px;
  line-height:1;
  font-weight:900;
  color:#fff;
  text-shadow:0 2px 6px rgba(80,0,35,.34);
  will-change:transform;
}
#counterFrame{
  position:absolute;
  left:0;
  top:0;
  width:630px;
  height:420px;
  border:0;
  margin:0;
  padding:0;
  background:transparent;
  transform:translateY(0);
  transition:transform .52s cubic-bezier(.22,.78,.24,1);
  will-change:transform;
  z-index:1;
}
#stage.active #counterFrame{transform:translateY(56px)}
</style>
</head>
<body>
<div id="stage">
  <div id="marqueeSlot">
    <div id="banner">
      <div id="shine"></div>
      <div id="badge">🎁 50 贈</div>
      <div id="lane"><div id="text"></div></div>
    </div>
  </div>
  <iframe id="counterFrame" src="obs-overlay.html" scrolling="no" title="現行累積豬叫與海豹拍"></iframe>
</div>
<script>
(() => {
  const MIN_GIFT=50;
  const DELUXE_GIFT=100;
  const stage=document.getElementById('stage');
  const banner=document.getElementById('banner');
  const badge=document.getElementById('badge');
  const lane=document.getElementById('lane');
  const text=document.getElementById('text');
  const queue=[];
  let playing=false;
  const sleep=ms=>new Promise(r=>setTimeout(r,ms));

  function normalize(p){
    return {
      name:String(p?.name||p?.who||'匿名').trim()||'匿名',
      count:Math.max(0,Math.floor(Number(p?.count??p?.total??0)||0))
    };
  }

  function specialText(count){
    if(count===100)return '089457';
    if(count===150)return '香港13太飽';
    if(count>=200)return '全場起飛';
    return '';
  }

  function messageFor({name,count}){
    const pats=Math.floor(count/5);
    const special=specialText(count);
    if(count>=DELUXE_GIFT){
      return `🔥 ${name} 豪擲 ${count} 份訂閱！${special ? special+'！' : ''}海豹拍肚 +${pats} 🔥`;
    }
    return `🎁 ${name} 贈送 ${count} 份訂閱！海豹拍肚 +${pats}！`;
  }

  function setLook(item){
    const deluxe=item.count>=DELUXE_GIFT;
    banner.classList.remove('standard','deluxe','shine-now');
    banner.classList.add(deluxe?'deluxe':'standard');
    badge.textContent=deluxe?`👑 ${item.count} 贈`:`🎁 ${item.count} 贈`;
    text.textContent=messageFor(item);
    void banner.offsetWidth;
    banner.classList.add('shine-now');
  }

  async function playOne(item){
    setLook(item);
    text.style.transition='none';
    text.style.transform='translateX(0)';
    await sleep(80);

    const distance=lane.clientWidth+text.scrollWidth+32;
    const deluxe=item.count>=DELUXE_GIFT;
    const pxPerSecond=deluxe?112:126;
    const duration=Math.max(deluxe?6.4:5.6,distance/pxPerSecond);
    text.style.transition=`transform ${duration}s linear`;
    requestAnimationFrame(()=>requestAnimationFrame(()=>text.style.transform=`translateX(-${distance}px)`));
    await sleep(duration*1000);
  }

  async function drain(){
    if(playing)return;
    playing=true;

    // 630x420 外框完全不變：先把原圖往下推 56px，底部自然被裁掉 56px。
    stage.classList.add('active');
    await sleep(560);

    // 圖片下移完成後，跑馬燈才從左上方滑進來。
    banner.classList.add('show');
    await sleep(430);

    while(true){
      while(queue.length){
        await playOne(queue.shift());
        await sleep(100);
      }
      // 連續贈訂時保持同一個下移狀態，不重複推動圖片。
      await sleep(420);
      if(queue.length)continue;
      break;
    }

    // 全部播完：先收跑馬燈，再讓原圖回到最上面。
    banner.classList.remove('show');
    await sleep(430);
    stage.classList.remove('active');
    await sleep(560);
    playing=false;

    if(queue.length)drain();
  }

  function enqueue(payload){
    const item=normalize(payload);
    if(item.count<MIN_GIFT)return {accepted:false,reason:'below-threshold'};
    queue.push(item);
    drain();
    return {accepted:true};
  }

  window.ZoeGiftMarquee={enqueue,getQueue:()=>queue.slice(),isPlaying:()=>playing};
  window.addEventListener('message',e=>{
    if(e?.data?.type==='zoebot-gift-marquee')enqueue(e.data);
  });

  const params=new URLSearchParams(location.search);
  if(params.has('count'))setTimeout(()=>enqueue({name:params.get('name')||'測試觀眾',count:params.get('count')}),450);
})();
</script>
</body>
</html>
