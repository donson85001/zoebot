function runMarqueeSyncedToVideo(item,entry,distance){const video=entry.video,clip=Number(video.duration),start=Math.max(0,Number(video.currentTime)||0);if(!(Number.isFinite(clip)&&clip>start+.05)){const duration=fallbackDuration(item,distance);text.style.transition=`transform ${duration}s linear`;requestAnimationFrame(()=>requestAnimationFrame(()=>text.style.transform=`translateX(-${distance}px)`));return sleep(duration*1000)}text.style.transition='none';return new Promise(resolve=>{let done=false;const span=Math.max(.001,clip-start),finish=()=>{if(done)return;done=true;text.style.transform=`translateX(-${distance}px)`;resolve()},tick=()=>{if(done)return;const now=Math.max(start,Number(video.currentTime)||start),progress=Math.min(1,Math.max(0,(now-start)/span));text.style.transform=`translateX(-${distance*progress}px)`;if(video.ended||now>=clip-.04){finish();return}requestAnimationFrame(tick)};requestAnimationFrame(tick)})}
function waitForVideoFinish(video){if(!video||video.ended)return Promise.resolve();return new Promise(resolve=>{let done=false,poll=0,timer=0;const cleanup=()=>{video.removeEventListener('ended',finish);video.removeEventListener('error',finish);clearInterval(poll);clearTimeout(timer)},finish=()=>{if(done)return;done=true;cleanup();resolve()},check=()=>{const d=Number(video.duration),t=Number(video.currentTime);if(video.ended||(Number.isFinite(d)&&d>0&&Number.isFinite(t)&&t>=d-.04))finish()};video.addEventListener('ended',finish,{once:true});video.addEventListener('error',finish,{once:true});poll=setInterval(check,100);const d=Number(video.duration);timer=setTimeout(finish,Number.isFinite(d)&&d>0?Math.min(90000,Math.max(10000,(d+15)*1000)):45000);check()})}

async function playOne(item){const entry=entryFor(item.count,item.variant,item.mediaAlt);hideActive();banner.classList.remove('show');await sleep(180);await playTierIntro(item);await switchMedia(entry);setLook(item);text.style.transition='none';text.style.transform='translateX(0)';banner.classList.add('show');await sleep(430);await sleep(70);const distance=lane.clientWidth+text.scrollWidth+54,videoDone=waitForVideoFinish(entry.video),marqueeDone=runMarqueeSyncedToVideo(item,entry,distance);await Promise.all([marqueeDone,videoDone]);hideActive();banner.classList.remove('show');await sleep(220)}async function waitForTrueIdle(){while(true){if(queue.length)return false;const left=IDLE_GRACE_MS-(Date.now()-lastEnqueueAt);if(left<=0)return true;await sleep(Math.min(120,left))}}async function drain(){if(playing)return;playing=true;stage.classList.add('active');await sleep(300);while(true){while(queue.length)await playOne(queue.shift());if(!(await waitForTrueIdle()))continue;stage.classList.remove('active');await sleep(420);if(queue.length){stage.classList.add('active');await sleep(300);continue}break}playing=false;if(pendingBuild){const build=pendingBuild;pendingBuild='';reloadToBuild(build);return}if(recoveryReloadPending){recoveryReloadPending=false;reloadToBuild(OBS_BUILD);return}if(queue.length)drain()}function enqueue(payload){const item=normalize(payload);if(item.count<MIN_GIFT)return{accepted:false,reason:'below-threshold'};if(item.eventId){if(seenEventIds.has(item.eventId))return{accepted:false,reason:'duplicate'};seenEventIds.add(item.eventId);if(seenEventIds.size>500)seenEventIds.delete(seenEventIds.values().next().value)}item.variant=chooseVariant(item);primeEntry(entryFor(item.count,item.variant,item.mediaAlt));lastEnqueueAt=Date.now();queue.push(item);drain();return{accepted:true,tier:tierForCount(item.count),variant:item.variant}}window.ZoeGiftMarquee={enqueue,getQueue:()=>queue.slice(),isPlaying:()=>playing,messageFor,getNextVariants:()=>({...nextVariant})}; function cellValue(cell){if(!cell||cell.v===null||cell.v===undefined)return'';return cell.v}function parseSheetTime(cell){const v=cellValue(cell);if(typeof v==='string'){const m=v.match(/^Date\((\d+),(\d+),(\d+),(\d+),(\d+),(\d+)\)$/);if(m)return new Date(+m[1],+m[2],+m[3],+m[4],+m[5],+m[6]).getTime()}const f=String(cell?.f||''),m=f.match(/(\d{4})\/(\d{1,2})\/(\d{1,2})\s+(\d{1,2}):(\d{2}):(\d{2})/);if(m)return new Date(+m[1],+m[2]-1,+m[3],+m[4],+m[5],+m[6]).getTime();return 0}function parseGiftRows(resp){const rows=resp?.table?.rows||[];return rows.map(r=>{const c=r?.c||[];return{tsMs:parseSheetTime(c[0]),who:String(cellValue(c[2])||'匿名').trim()||'匿名',count:Math.max(0,Math.floor(Number(cellValue(c[3]))||0)),eventId:String(cellValue(c[4])||'').trim()}}).filter(x=>x.eventId)}function queueSheetItem(item){if(!item?.eventId||sheetSeen.has(item.eventId))return;if(item.count<MIN_GIFT){sheetSeen.add(item.eventId);if(sheetSeen.size>500)sheetSeen.delete(sheetSeen.values().next().value);saveSheetState();return}const normalized=normalize({name:item.who,count:item.count,eventId:item.eventId});normalized.variant=chooseVariant(normalized);sheetSeen.add(item.eventId);if(sheetSeen.size>500)sheetSeen.delete(sheetSeen.values().next().value);saveSheetState();enqueue(normalized)}function handleSheetRows(items){if(!items.length)return;if(firstSheetSuccess){firstSheetSuccess=false;let legacyInitialized=false;try{legacyInitialized=localStorage.getItem(SHEET_INIT_KEY)==='1'}catch(_){}const hasState=legacyInitialized||sheetSeen.size>0;if(!hasState){const now=Date.now(),recentCutoff=3*60*1000,recent=[];for(const item of items){if(item.count>=MIN_GIFT&&item.tsMs&&now-item.tsMs>=0&&now-item.tsMs<=recentCutoff)recent.push(item);else sheetSeen.add(item.eventId)}saveSheetState();recent.slice().reverse().forEach(queueSheetItem);return}}const fresh=[];for(const item of items){if(sheetSeen.has(item.eventId))continue;fresh.push(item)}fresh.reverse().forEach(queueSheetItem)}function buildSheetUrl(call
