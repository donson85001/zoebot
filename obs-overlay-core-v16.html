backName=''){const q="select A,B,C,E,I where B = '贈送訂閱' order by A desc limit 100",u=new URL(`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq`);u.searchParams.set('sheet',SHEET_NAME);u.searchParams.set('headers','1');u.searchParams.set('tq',q);u.searchParams.set('tqx',callbackName?`out:json;responseHandler:${callbackName}`:'out:json');u.searchParams.set('_',String(Date.now()));return u}async function fetchGiftRows(){const r=await fetch(buildSheetUrl().toString(),{cache:'no-store'});if(!r.ok)throw new Error(`sheet HTTP ${r.status}`);const raw=await r.text(),m=raw.match(/google\.visualization\.Query\.setResponse\(([\s\S]*?)\);?\s*$/);if(!m)throw new Error('sheet response parse failed');const resp=JSON.parse(m[1]);if(resp?.status&&resp.status!=='ok')throw new Error('sheet query failed');return parseGiftRows(resp)}function fetchGiftRowsJsonp(){return new Promise((resolve,reject)=>{const cb='__zoeSheetCb_'+Date.now()+'_'+Math.floor(Math.random()*100000),s=document.createElement('script');let done=false;const cleanup=()=>{if(done)return;done=true;clearTimeout(timer);try{delete window[cb]}catch(_){window[cb]=undefined}s.remove()},timer=setTimeout(()=>{cleanup();reject(new Error('sheet jsonp timeout'))},7000);window[cb]=resp=>{try{if(resp?.status&&resp.status!=='ok')throw new Error('sheet jsonp query failed');const rows=parseGiftRows(resp);cleanup();resolve(rows)}catch(e){cleanup();reject(e)}};s.onerror=()=>{cleanup();reject(new Error('sheet jsonp load failed'))};s.src=buildSheetUrl(cb).toString();document.head.appendChild(s)})}async function pollGiftSheet(){if(sheetBusy)return;sheetBusy=true;try{let rows;try{rows=await fetchGiftRows()}catch(fetchErr){console.warn('Gift sheet fetch failed; trying JSONP fallback',fetchErr);rows=await fetchGiftRowsJsonp()}lastSheetSuccess=Date.now();handleSheetRows(rows)}catch(e){console.error('Gift sheet poll failed',e)}finally{sheetBusy=false}}
pollGiftSheet();setInterval(pollGiftSheet,SHEET_POLL_MS);setInterval(()=>{if(Date.now()-lastSheetSuccess<90000)return;if(playing||queue.length)recoveryReloadPending=true;else reloadToBuild(OBS_BUILD)},15000);
})();
