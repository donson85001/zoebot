function cellValue(cell){if(!cell||cell.v===null||cell.v===undefined)return'';return cell.v}function parseSheetTime(cell){const v=cellValue(cell);if(typeof v==='string'){const m=v.match(/^Date\((\d+),(\d+),(\d+),(\d+),(\d+),(\d+)\)$/);if(m)return new Date(+m[1],+m[2],+m[3],+m[4],+m[5],+m[6]).getTime()}const f=String(cell?.f||''),m=f.match(/(\d{4})\/(\d{1,2})\/(\d{1,2})\s+(\d{1,2}):(\d{2}):(\d{2})/);if(m)return new Date(+m[1],+m[2]-1,+m[3],+m[4],+m[5],+m[6]).getTime();return 0}function parseGiftRows(resp){const rows=resp?.table?.rows||[];return rows.map(r=>{const c=r?.c||[];return{tsMs:parseSheetTime(c[0]),who:String(cellValue(c[2])||'匿名').trim()||'匿名',count:Math.max(0,Math.floor(Number(cellValue(c[3]))||0)),eventId:String(cellValue(c[4])||'').trim()}}).filter(x=>x.eventId)}function queueSheetItem(item){if(!item?.eventId||sheetSeen.has(item.eventId))return;if(item.count<MIN_GIFT){sheetSeen.add(item.eventId);if(sheetSeen.size>500)sheetSeen.delete(sheetSeen.values().next().value);saveSheetState();return}const normalized=normalize({name:item.who,count:item.count,eventId:item.eventId});normalized.variant=chooseVariant(normalized);sheetSeen.add(item.eventId);if(sheetSeen.size>500)sheetSeen.delete(sheetSeen.values().next().value);saveSheetState();enqueue(normalized)}function handleSheetRows(items){if(!items.length)return;if(firstSheetSuccess){firstSheetSuccess=false;let legacyInitialized=false;try{legacyInitialized=localStorage.getItem(SHEET_INIT_KEY)==='1'}catch(_){}const hasState=legacyInitialized||sheetSeen.size>0;if(!hasState){const now=Date.now(),recentCutoff=3*60*1000,recent=[];for(const item of items){if(item.count>=MIN_GIFT&&item.tsMs&&now-item.tsMs>=0&&now-item.tsMs<=recentCutoff)recent.push(item);else sheetSeen.add(item.eventId)}saveSheetState();recent.slice().reverse().forEach(queueSheetItem);return}}const fresh=[];for(const item of items){if(sheetSeen.has(item.eventId))continue;fresh.push(item)}fresh.reverse().forEach(queueSheetItem)}function buildSheetUrl(callbackName=''){const q="select A,B,C,E,I where B = '贈送訂閱' order by A desc limit 100",u=new URL(`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq`);u.searchParams.set('sheet',SHEET_NAME);u.searchParams.set('headers','1');u.searchParams.set('tq',q);u.searchParams.set('tqx',callbackName?`out:json;responseHandler:${callbackName}`:'out:json');u.searchParams.set('_',String(Date.now()));return u}async function fetchGiftRows(){const r=await fetch(buildSheetUrl().toString(),{cache:'no-store'});if(!r.ok)throw new Error(`sheet HTTP ${r.status}`);const raw=await r.text(),m=raw.match(/google\.visualization\.Query\.setResponse\(([\s\S]*?)\);?\s*$/);if(!m)throw new Error('sheet response parse failed');const resp=JSON.parse(m[1]);if(resp?.status&&resp.status!=='ok')throw new Error('sheet query failed');return parseGiftRows(resp)}function fetchGiftRowsJsonp(){return new Promise((resolve,reject)=>{const cb='__zoeSheetCb_'+Date.now()+'_'+Math.floor(Math.random()*100000),s=document.createElement('script');let done=false;const cleanup=()=>{if(done)return;done=true;clearTimeout(timer);try{delete window[cb]}catch(_){window[cb]=undefined}s.remove()},timer=setTimeout(()=>{cleanup();reject(new Error('sheet jsonp timeout'))},7000);window[cb]=resp=>{try{if(resp?.status&&resp.status!=='ok')throw new Error('sheet jsonp query failed');const rows=parseGiftRows(resp);cleanup();resolve(rows)}catch(e){cleanup();reject(e)}};s.onerror=()=>{cleanup();reject(new Error('sheet jsonp load failed'))};s.src=buildSheetUrl(cb).toString();document.head.appendChild(s)})}async function pollGiftSheet(){if(sheetBusy)return;sheetBusy=true;try{let rows;try{rows=await fetchGiftRows()}catch(fetchErr){console.warn('Gift sheet fetch failed; trying JSONP fallback',fetchErr);rows=await fetchGiftRowsJsonp()}lastSheetSuccess=Date.now();handleSheetRows(rows)}catch(e){console.error('Gift sheet poll failed',e)}finally{sheetBusy=false}}
pollGiftSheet();setInterval(pollGiftSheet,SHEET_POLL_MS);setInterval(()=>{if(Date.now()-lastSheetSuccess<90000)return;if(playing||queue.length)recoveryReloadPending=true;else reloadToBuild(OBS_BUILD)},15000);
})();
