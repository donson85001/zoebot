<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OBS 餘興節目計數器</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:630px;height:420px;overflow:hidden;background:transparent;font-family:Arial,'Noto Sans TC','Microsoft JhengHei',sans-serif}
#stage{position:relative;width:630px;height:420px;overflow:hidden;background:transparent}
#counterPanel{position:absolute;left:0;top:0;width:630px;height:420px;background:url('WF拍肚.png') 0 0 / 630px 420px no-repeat;transform:translateY(0);transition:transform .55s cubic-bezier(.22,.78,.24,1);will-change:transform}
#stage.active #counterPanel{transform:translateY(56px)}
.num{position:absolute;width:102px;height:54px;display:flex;align-items:center;justify-content:center;background:transparent;border:0;box-shadow:none;color:#d94f72;font-weight:800;font-size:38px;line-height:1;letter-spacing:0;text-shadow:none;white-space:nowrap}
#months{left:464px;top:198px}
#gifts{left:464px;top:278px}
#marqueeSlot{position:absolute;left:0;top:0;width:630px;height:168px;overflow:hidden;z-index:3;pointer-events:none}
#banner{position:absolute;left:0;top:0;width:630px;height:162px;border-radius:24px;overflow:hidden;opacity:0;transform:translateX(-650px);transition:transform .42s cubic-bezier(.2,.9,.25,1),opacity .25s ease;filter:drop-shadow(0 8px 14px rgba(0,0,0,.22))}
#banner.show{opacity:1;transform:translateX(0)}
#banner.mode50{background:linear-gradient(90deg,#ef6598,#f79bc0 52%,#ef6598);border:5px solid rgba(255,255,255,.96);box-shadow:inset 0 1px 0 rgba(255,255,255,.28)}
#banner.mode100{background:linear-gradient(100deg,#d94f72 0%,#f07fa1 38%,#ffd56b 62%,#ec7099 100%);border:5px solid #fff3bd;box-shadow:inset 0 0 20px rgba(255,255,255,.22)}
#banner.mode150{background:linear-gradient(100deg,#70207f 0%,#b9328b 32%,#f04f9c 58%,#8b2b99 100%);border:5px solid #ffd6f0;box-shadow:inset 0 0 24px rgba(255,255,255,.18)}
#banner.mode200{background:linear-gradient(100deg,#25133f 0%,#5c2679 30%,#d34794 58%,#f5b63a 100%);border:5px solid #ffe28a;box-shadow:inset 0 0 28px rgba(255,230,155,.16)}
#shine{position:absolute;inset:0;background:linear-gradient(115deg,transparent 0 38%,rgba(255,255,255,.28) 45%,transparent 52%);transform:translateX(-125%)}
#banner.shine-now #shine{animation:shine 1.1s ease-out 1}
@keyframes shine{to{transform:translateX(125%)}}
#badge{position:absolute;left:18px;top:37px;width:102px;height:88px;border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:2;border:2px solid rgba(255,255,255,.92);box-shadow:0 4px 12px rgba(100,20,55,.12),inset 0 1px 0 #fff;transition:background .2s ease,color .2s ease}
.mode50 #badge{background:linear-gradient(180deg,#fff,#fff7fb);color:#be2d66}
.mode100 #badge{background:linear-gradient(180deg,#fff7c7,#fffdf0 62%,#fff);color:#a06400}
.mode150 #badge{background:linear-gradient(180deg,#ffeaf7,#fff 65%);color:#7d2678}
.mode200 #badge{background:linear-gradient(180deg,#fff0ac,#fff8d9 58%,#fff);color:#6f3e00}
#badgeIcon{font-size:23px;line-height:1;margin-bottom:7px;filter:drop-shadow(0 1px 1px rgba(0,0,0,.08))}
#badgeValueRow{display:flex;align-items:flex-end;justify-content:center;gap:4px;line-height:1;max-width:90px;white-space:nowrap}
#badgeCount{font-size:29px;line-height:.92;font-weight:900;letter-spacing:-1.2px}
#badgeUnit{font-size:13px;line-height:1;font-weight:900;margin-bottom:2px;letter-spacing:.2px}
#lane{position:absolute;left:132px;right:18px;top:0;height:100%;overflow:hidden;display:flex;align-items:center}
#text{position:absolute;left:100%;white-space:nowrap;font-size:60px;line-height:1.02;font-weight:900;letter-spacing:.2px;color:#fff;text-shadow:0 4px 10px rgba(60,0,30,.34);will-change:transform}
#tier50Media,#tier100Media,#tier150Media,#tier200Media{position:absolute;left:12px;top:154px;width:260px;height:260px;overflow:hidden;border-radius:18px;display:block;opacity:0;z-index:2;pointer-events:none;box-shadow:0 6px 18px rgba(0,0,0,.22);transition:opacity .06s linear}
#tier50Media.show,#tier100Media.show,#tier150Media.show,#tier200Media.show{opacity:1}
#tier50Video,#tier100Video,#tier150Video,#tier200Video{width:100%;height:100%;object-fit:cover;transform:scale(1.12);transform-origin:center center;display:block}
</style>
</head>
<body>
<div id="stage">
  <div id="counterPanel">
    <div id="months" class="num">1546</div>
    <div id="gifts" class="num">395</div>
  </div>
  <div id="marqueeSlot">
    <div id="banner">
      <div id="shine"></div>
      <div id="badge">
        <div id="badgeIcon">🎁</div>
        <div id="badgeValueRow"><span id="badgeCount">50</span><span id="badgeUnit">贈</span></div>
      </div>
      <div id="lane"><div id="text"></div></div>
    </div>
  </div>
  <div id="tier50Media"><video id="tier50Video" src="3xwater-260.mp4?v=910414b99450" muted playsinline preload="auto"></video></div>
  <div id="tier100Media"><video id="tier100Video" src="egg-780.mp4?v=b7d56d800a11" muted playsinline preload="auto"></video></div>
  <div id="tier150Media"><video id="tier150Video" src="lemon-780.mp4?v=c51774af6d5f" muted playsinline preload="auto"></video></div>
  <div id="tier200Media"><video id="tier200Video" src="cel-780.mp4?v=e7dcd42873ad" muted playsinline preload="auto"></video></div>
</div>
<script>
(() => {
  'use strict';
  const OBS_BUILD='20260905-1740-production-media-v12';
  const UPDATE_CHECK_MS=10000;
  const MIN_GIFT=50;
  const IDLE_GRACE_MS=1100;
  const stage=document.getElementById('stage');
  const banner=document.getElementById('banner');
  const badgeIcon=document.getElementById('badgeIcon');
  const badgeCount=document.getElementById('badgeCount');
  const lane=document.getElementById('lane');
  const text=document.getElementById('text');
  const months=document.getElementById('months');
  const gifts=document.getElementById('gifts');
  const tier50Media=document.getElementById('tier50Media');
  const tier50Video=document.getElementById('tier50Video');
  const tier100Media=document.getElementById('tier100Media');
  const tier100Video=document.getElementById('tier100Video');
  const tier150Media=document.getElementById('tier150Media');
  const tier150Video=document.getElementById('tier150Video');
  const tier200Media=document.getElementById('tier200Media');
  const tier200Video=document.getElementById('tier200Video');
  const queue=[];
  const seenEventIds=new Set();
  let playing=false;
  let lastEnqueueAt=0;
  let pendingBuild='';
  let recoveryReloadPending=false;
  let activeMedia=null;
  let activeVideo=null;
  const sleep=ms=>new Promise(r=>setTimeout(r,ms));
  const mediaPairs=[[tier50Media,tier50Video],[tier100Media,tier100Video],[tier150Media,tier150Video],[tier200Media,tier200Video]];
  const mediaForCount=count=>count>=200?mediaPairs[3]:count>=150?mediaPairs[2]:count>=100?mediaPairs[1]:mediaPairs[0];
  mediaPairs.forEach(([,video])=>{video.preload='auto';try{video.load()}catch(e){}});
  function primeMediaForCount(count){const [,video]=mediaForCount(count);if(video.preload!=='auto'){video.preload='auto';video.load()}}
  function waitUntilPlayable(video,timeout=700){if(video.readyState>=3)return Promise.resolve();return new Promise(resolve=>{let done=false;const finish=()=>{if(done)return;done=true;video.removeEventListener('canplay',finish);clearTimeout(timer);resolve()};const timer=setTimeout(finish,timeout);video.addEventListener('canplay',finish,{once:true})})}
  function waitForRenderedFrame(video,timeout=450){if(typeof video.requestVideoFrameCallback==='function')return new Promise(resolve=>{let done=false;const finish=()=>{if(done)return;done=true;clearTimeout(timer);resolve()};const timer=setTimeout(finish,timeout);video.requestVideoFrameCallback(finish)});return new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)))}
  function resetVideo(video){video.pause();try{video.currentTime=0}catch(e){}}
  async function switchMedia(media,video){
    if(activeVideo===video){resetVideo(video);try{await video.play()}catch(e){console.error(e)}await waitForRenderedFrame(video);return}
    await waitUntilPlayable(video);resetVideo(video);try{await video.play()}catch(e){console.error(e)}await waitForRenderedFrame(video);
    const oldMedia=activeMedia,oldVideo=activeVideo;media.classList.add('show');activeMedia=media;activeVideo=video;
    if(oldMedia&&oldMedia!==media){oldMedia.classList.remove('show');resetVideo(oldVideo)}
  }
  function hideActive(){if(activeMedia)activeMedia.classList.remove('show');if(activeVideo)resetVideo(activeVideo);activeMedia=null;activeVideo=null}
  function reloadToBuild(build){
    const next=new URL(location.href);
    next.searchParams.set('__obs_build',build||OBS_BUILD);
    next.searchParams.set('_',String(Date.now()));
    location.replace(next.toString());
  }
  async function checkForPageUpdate(){
    try{
      const probe=new URL(location.href);
      probe.searchParams.set('__obs_update_check',String(Date.now()));
      const r=await fetch(probe.toString(),{cache:'no-store'});
      if(!r.ok)return;
      const html=await r.text();
      const m=html.match(/const OBS_BUILD='([^']+)'/);
      const remoteBuild=m&&m[1];
      if(remoteBuild && remoteBuild!==OBS_BUILD){
        if(playing||queue.length)pendingBuild=remoteBuild;
        else reloadToBuild(remoteBuild);
      }
    }catch(_){ }
  }
  setTimeout(checkForPageUpdate,5000);
  setInterval(checkForPageUpdate,UPDATE_CHECK_MS);
  const COUNTER_API='https://script.google.com/macros/s/AKfycbzLet29KonFvVjhxrzf7oM-g-FyfhVkyzYjbRLQtrHeX7zh4KLNXsIbfRdqGnYZuWzzZg/exec?action=stats';
  async function updateCounters(){
    try{
      const r=await fetch(COUNTER_API+'&_='+Date.now(),{cache:'no-store'});
      const d=await r.json();
      if(d&&d.ok!==false){
        const m=Number(d.subscriptionMonths),g=Number(d.giftSubCount);
        if(Number.isFinite(m))months.textContent=String(Math.trunc(m));
        if(Number.isFinite(g))gifts.textContent=String(Math.trunc(g));
      }
    }catch(e){console.error('Counter update failed',e);}
  }
  updateCounters();
  setInterval(updateCounters,5000);
  function normalize(payload){return{name:String(payload?.name||payload?.who||'匿名').trim()||'匿名',count:Math.max(0,Math.floor(Number(payload?.count??payload?.total??0)||0)),eventId:String(payload?.eventId||payload?.id||'').trim()}}
  function modeFor(count){if(count>=200)return'mode200';if(count>=150)return'mode150';if(count>=100)return'mode100';return'mode50'}
  function iconFor(count){if(count>=200)return'🔥';if(count>=150)return'👑';if(count>=100)return'⭐';return'🎁'}
  function messageFor({name,count}){const pats=Math.floor(count/5);if(count>=200)return`${name} 跟肉乙去區公所領了 ${count}顆花生！台中0859457！海豹拍肚 +${pats}！`;if(count>=150)return`肉乙爆氣把 ${name} 丟地板了 ${count}次！cheer10000 我只是剛好看到列車 大家安安！海豹拍肚 +${pats}！`;if(count>=100)return`肉乙塞給 ${name} ${count}個蛋塔！香港13太飽猴！海豹拍肚 +${pats}！`;return`肉乙被 ${name} 逼喝了 ${count}瓶水！電競媽祖保持微笑 :)！海豹拍肚 +${pats}！`}
  function setLook(item){const mode=modeFor(item.count);banner.classList.remove('mode50','mode100','mode150','mode200','shine-now');banner.classList.add(mode);badgeIcon.textContent=iconFor(item.count);badgeCount.textContent=String(item.count);text.textContent=messageFor(item);void banner.offsetWidth;banner.classList.add('shine-now')}
  const SHEET_ID='14Yv_DyqvCsgQJQ98vZk_IkQ527xLPSVvLaNBnDGcMug';
  const SHEET_NAME='SubscriptionDetail';
  const SHEET_POLL_MS=1200;
  const SHEET_SEEN_KEY='zoebot-marquee-sheet-seen-v1';
  const SHEET_PENDING_KEY='zoebot-marquee-sheet-pending-v2';
  const SHEET_INIT_KEY='zoebot-marquee-sheet-initialized-v1';
  const sheetSeen=new Set();
  const sheetPending=new Map();
  let firstSheetSuccess=true;
  let sheetBusy=false;
  let lastSheetSuccess=Date.now();
  try{const saved=JSON.parse(localStorage.getItem(SHEET_SEEN_KEY)||'[]');if(Array.isArray(saved))saved.slice(-500).forEach(x=>sheetSeen.add(String(x)))}catch(_){}
  try{const saved=JSON.parse(localStorage.getItem(SHEET_PENDING_KEY)||'[]');if(Array.isArray(saved))saved.slice(-100).forEach(x=>{const item=normalize(x);if(item.eventId&&item.count>=MIN_GIFT)sheetPending.set(item.eventId,item)})}catch(_){}
  function saveSheetState(){try{localStorage.setItem(SHEET_SEEN_KEY,JSON.stringify([...sheetSeen].slice(-500)));localStorage.setItem(SHEET_PENDING_KEY,JSON.stringify([...sheetPending.values()].slice(-100)));localStorage.setItem(SHEET_INIT_KEY,'1')}catch(_){}}
  function markEventComplete(item){if(!item?.eventId)return;sheetPending.delete(item.eventId);sheetSeen.add(item.eventId);if(sheetSeen.size>500)sheetSeen.delete(sheetSeen.values().next().value);saveSheetState()}
  async function playOne(item){
    const [media,video]=mediaForCount(item.count);await switchMedia(media,video);setLook(item);
    text.style.transition='none';text.style.transform='translateX(0)';await sleep(70);
    const distance=lane.clientWidth+text.scrollWidth+54,pxPerSecond=item.count<100?188:172,duration=Math.max(item.count<100?6.8:7.2,distance/pxPerSecond);
    text.style.transition=`transform ${duration}s linear`;requestAnimationFrame(()=>requestAnimationFrame(()=>text.style.transform=`translateX(-${distance}px)`));
    await sleep(duration*1000);
    markEventComplete(item);
    if(!queue.length)hideActive();
  }
  async function waitForTrueIdle(){while(true){if(queue.length)return false;const left=IDLE_GRACE_MS-(Date.now()-lastEnqueueAt);if(left<=0)return true;await sleep(Math.min(120,left))}}
  async function drain(){if(playing)return;playing=true;stage.classList.add('active');await sleep(580);if(queue.length)setLook(queue[0]);banner.classList.add('show');await sleep(430);while(true){while(queue.length){await playOne(queue.shift());await sleep(100)}if(!(await waitForTrueIdle()))continue;hideActive();banner.classList.remove('show');await sleep(420);if(queue.length){if(queue.length)setLook(queue[0]);banner.classList.add('show');await sleep(430);continue}stage.classList.remove('active');await sleep(580);if(queue.length){stage.classList.add('active');await sleep(580);if(queue.length)setLook(queue[0]);banner.classList.add('show');await sleep(430);continue}break}playing=false;if(pendingBuild){const build=pendingBuild;pendingBuild='';reloadToBuild(build);return}if(recoveryReloadPending){recoveryReloadPending=false;reloadToBuild(OBS_BUILD);return}if(queue.length)drain()}
  function enqueue(payload){const item=normalize(payload);if(item.count<MIN_GIFT)return{accepted:false,reason:'below-threshold'};primeMediaForCount(item.count);if(item.eventId){if(seenEventIds.has(item.eventId))return{accepted:false,reason:'duplicate'};seenEventIds.add(item.eventId);if(seenEventIds.size>500)seenEventIds.delete(seenEventIds.values().next().value)}lastEnqueueAt=Date.now();queue.push(item);drain();return{accepted:true}}
  window.ZoeGiftMarquee={enqueue,getQueue:()=>queue.slice(),isPlaying:()=>playing,messageFor};
  window.addEventListener('message',e=>{if(e?.data?.type==='zoebot-gift-marquee')enqueue(e.data)});
  function cellValue(cell){if(!cell||cell.v===null||cell.v===undefined)return'';return cell.v}
  function parseSheetTime(cell){const v=cellValue(cell);if(typeof v==='string'){const m=v.match(/^Date\((\d+),(\d+),(\d+),(\d+),(\d+),(\d+)\)$/);if(m)return new Date(+m[1],+m[2],+m[3],+m[4],+m[5],+m[6]).getTime()}const f=String(cell?.f||''),m=f.match(/(\d{4})\/(\d{1,2})\/(\d{1,2})\s+(\d{1,2}):(\d{2}):(\d{2})/);if(m)return new Date(+m[1],+m[2]-1,+m[3],+m[4],+m[5],+m[6]).getTime();return 0}
  function parseGiftRows(resp){const rows=resp?.table?.rows||[];return rows.map(r=>{const c=r?.c||[];return{tsMs:parseSheetTime(c[0]),who:String(cellValue(c[2])||'匿名').trim()||'匿名',count:Math.max(0,Math.floor(Number(cellValue(c[3]))||0)),eventId:String(cellValue(c[4])||'').trim()}}).filter(x=>x.eventId)}
  function queueSheetItem(item){if(!item?.eventId||sheetSeen.has(item.eventId)||sheetPending.has(item.eventId))return;if(item.count<MIN_GIFT){sheetSeen.add(item.eventId);if(sheetSeen.size>500)sheetSeen.delete(sheetSeen.values().next().value);saveSheetState();return}const normalized=normalize({name:item.who,count:item.count,eventId:item.eventId});sheetPending.set(item.eventId,normalized);saveSheetState();enqueue(normalized)}
  function handleSheetRows(items){if(!items.length)return;if(firstSheetSuccess){firstSheetSuccess=false;let legacyInitialized=false;try{legacyInitialized=localStorage.getItem(SHEET_INIT_KEY)==='1'}catch(_){}const hasState=legacyInitialized||sheetSeen.size>0||sheetPending.size>0;if(!hasState){const now=Date.now(),recentCutoff=3*60*1000,recent=[];for(const item of items){if(item.count>=MIN_GIFT&&item.tsMs&&now-item.tsMs>=0&&now-item.tsMs<=recentCutoff)recent.push(item);else sheetSeen.add(item.eventId)}saveSheetState();recent.slice().reverse().forEach(queueSheetItem);return}}const fresh=[];for(const item of items){if(sheetSeen.has(item.eventId)||sheetPending.has(item.eventId))continue;fresh.push(item)}fresh.reverse().forEach(queueSheetItem)}
  function buildSheetUrl(callbackName=''){const q="select A,B,C,E,I where B = '贈送訂閱' order by A desc limit 100";const u=new URL(`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq`);u.searchParams.set('sheet',SHEET_NAME);u.searchParams.set('headers','1');u.searchParams.set('tq',q);u.searchParams.set('tqx',callbackName?`out:json;responseHandler:${callbackName}`:'out:json');u.searchParams.set('_',String(Date.now()));return u}
  async function fetchGiftRows(){const r=await fetch(buildSheetUrl().toString(),{cache:'no-store'});if(!r.ok)throw new Error(`sheet HTTP ${r.status}`);const raw=await r.text(),m=raw.match(/google\.visualization\.Query\.setResponse\(([\s\S]*?)\);?\s*$/);if(!m)throw new Error('sheet response parse failed');const resp=JSON.parse(m[1]);if(resp?.status&&resp.status!=='ok')throw new Error('sheet query failed');return parseGiftRows(resp)}
  function fetchGiftRowsJsonp(){return new Promise((resolve,reject)=>{const cb='__zoeSheetCb_'+Date.now()+'_'+Math.floor(Math.random()*100000),s=document.createElement('script');let done=false;const cleanup=()=>{if(done)return;done=true;clearTimeout(timer);try{delete window[cb]}catch(_){window[cb]=undefined}s.remove()};const timer=setTimeout(()=>{cleanup();reject(new Error('sheet jsonp timeout'))},7000);window[cb]=resp=>{try{if(resp?.status&&resp.status!=='ok')throw new Error('sheet jsonp query failed');const rows=parseGiftRows(resp);cleanup();resolve(rows)}catch(e){cleanup();reject(e)}};s.onerror=()=>{cleanup();reject(new Error('sheet jsonp load failed'))};s.src=buildSheetUrl(cb).toString();document.head.appendChild(s)})}
  async function pollGiftSheet(){if(sheetBusy)return;sheetBusy=true;try{let rows;try{rows=await fetchGiftRows()}catch(fetchErr){console.warn('Gift sheet fetch failed; trying JSONP fallback',fetchErr);rows=await fetchGiftRowsJsonp()}lastSheetSuccess=Date.now();handleSheetRows(rows)}catch(e){console.error('Gift sheet poll failed',e)}finally{sheetBusy=false}}
  if(sheetPending.size)[...sheetPending.values()].forEach(item=>enqueue(item));
  pollGiftSheet();
  setInterval(pollGiftSheet,SHEET_POLL_MS);
  setInterval(()=>{if(Date.now()-lastSheetSuccess<90000)return;if(playing||queue.length)recoveryReloadPending=true;else reloadToBuild(OBS_BUILD)},15000);
})();
</script>
</body>
</html>
