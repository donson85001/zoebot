<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OBS 餘興節目計數器</title>
<style>
html,body{margin:0;padding:0;background:transparent;overflow:hidden;width:100%;height:100%;}
#wrap{position:relative;width:554px;height:369px;background:url('obs-background.png') 0 0/554px 369px no-repeat;font-family:Arial,'Noto Sans TC','Microsoft JhengHei',sans-serif;}
.num{position:absolute;width:100px;height:58px;display:flex;align-items:center;justify-content:center;background:#fff8f9;color:#d94f72;font-weight:800;font-size:42px;line-height:1;letter-spacing:0;text-shadow:0 1px 0 #fff;}
#months{left:402px;top:169px;}
#gifts{left:402px;top:242px;}
</style>
</head>
<body>
<div id="wrap">
  <div id="months" class="num">1546</div>
  <div id="gifts" class="num">395</div>
</div>
<script>
(() => {
  const API='https://script.google.com/macros/s/AKfycbzLet29KonFvVjhxrzf7oM-g-FyfhVkyzYjbRLQtrHeX7zh4KLNXsIbfRdqGnYZuWzzZg/exec?action=stats';
  const months=document.getElementById('months');
  const gifts=document.getElementById('gifts');
  async function update(){
    try{
      const r=await fetch(API+'&_='+Date.now(),{cache:'no-store'});
      const d=await r.json();
      if(d && d.ok!==false){
        if(Number.isFinite(Number(d.subscriptionMonths))) months.textContent=String(Math.trunc(Number(d.subscriptionMonths)));
        if(Number.isFinite(Number(d.giftSubCount))) gifts.textContent=String(Math.trunc(Number(d.giftSubCount)));
      }
    }catch(e){ console.error('Counter update failed',e); }
  }
  update();
  setInterval(update,5000);
})();
</script>
</body>
</html>
