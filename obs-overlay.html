<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OBS 餘興節目計數器</title>
<style>
html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  background:transparent;
  overflow:hidden;
}
#wrap{
  position:relative;
  width:630px;
  height:420px;
  background:url('WF拍肚.png') 0 0 / 630px 420px no-repeat;
  font-family:Arial,'Noto Sans TC','Microsoft JhengHei',sans-serif;
}
.num{
  position:absolute;
  width:102px;
  height:54px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:transparent;
  border:0;
  box-shadow:none;
  color:#d94f72;
  font-weight:800;
  font-size:38px;
  line-height:1;
  letter-spacing:0;
  text-shadow:none;
  white-space:nowrap;
}
#months{left:464px;top:198px;}
#gifts{left:464px;top:278px;}
</style>
</head>
<body>
<div id="wrap">
  <div id="months" class="num">1546</div>
  <div id="gifts" class="num">395</div>
</div>
<script>
(() => {
  const API='https://script.google.com/macros/s/AKfycbzLet29KonFvVjhxrzf7oM-g-FyfhVkyzYjbRLQtrHeX7zh4KLNXsIbfRdqGnYZuWzzZg/exec?action=stats';
  const months=document.getElementById('months');
  const gifts=document.getElementById('gifts');

  async function update(){
    try{
      const r=await fetch(API+'&_='+Date.now(),{cache:'no-store'});
      const d=await r.json();
      if(d && d.ok!==false){
        const m=Number(d.subscriptionMonths);
        const g=Number(d.giftSubCount);
        if(Number.isFinite(m)) months.textContent=String(Math.trunc(m));
        if(Number.isFinite(g)) gifts.textContent=String(Math.trunc(g));
      }
    }catch(e){
      console.error('Counter update failed',e);
    }
  }

  update();
  setInterval(update,5000);
})();
</script>
</body>
</html>
