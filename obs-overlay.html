<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OBS 餘興節目計數器</title>
<style>
*{box-sizing:border-box}
html,body{
  margin:0;
  padding:0;
  width:630px;
  height:420px;
  background:transparent;
  overflow:hidden;
  font-family:Arial,'Noto Sans TC','Microsoft JhengHei',sans-serif;
}
#stage{
  position:relative;
  width:630px;
  height:420px;
  overflow:hidden;
  background:transparent;
}
#counterPanel{
  position:absolute;
  left:0;
  top:0;
  width:630px;
  height:420px;
  background:url('WF拍肚.png') 0 0 / 630px 420px no-repeat;
  transform:translateY(0);
  transition:transform .55s cubic-bezier(.22,.78,.24,1);
  will-change:transform;
}
#stage.active #counterPanel{transform:translateY(56px)}
.num{
  position:absolute;
  width:102px;
  height:54px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:transparent;
  border:0;
  box-shadow:none;
  color:#d94f72;
  font-weight:800;
  font-size:38px;
  line-height:1;
  letter-spacing:0;
  text-shadow:none;
  white-space:nowrap;
}
#months{left:464px;top:198px}
#gifts{left:464px;top:278px}
#marqueeSlot{
  position:absolute;
  left:0;
  top:0;
  width:630px;
  height:56px;
  overflow:hidden;
  z-index:3;
  pointer-events:none;
}
#banner{
  position:absolute;
  left:0;
  top:0;
  width:630px;
  height:54px;
  border-radius:14px;
  overflow:hidden;
  opacity:0;
  transform:translateX(-650px);
  transition:transform .42s cubic-bezier(.2,.9,.25,1),opacity .25s ease;
  filter:drop-shadow(0 6px 10px rgba(0,0,0,.25));
}
#banner.show{opacity:1;transform:translateX(0)}
#banner.standard{
  background:linear-gradient(90deg,rgba(255,103,157,.97),rgba(255,180,210,.97),rgba(255,103,157,.97));
  border:3px solid rgba(255,255,255,.95);
}
#banner.deluxe{
  background:linear-gradient(100deg,#7c258d,#ed4f99 31%,#ffd04d 55%,#ed4f99 80%,#7c258d);
  border:3px solid #fff0a2;
  box-shadow:inset 0 0 14px rgba(255,255,255,.22);
}
#shine{
  position:absolute;
  inset:0;
  background:linear-gradient(115deg,transparent 0 38%,rgba(255,255,255,.34) 45%,transparent 52%);
  transform:translateX(-125%);
}
#banner.shine-now #shine{animation:shine 1.1s ease-out 1}
@keyframes shine{to{transform:translateX(125%)}}
#badge{
  position:absolute;
  left:8px;
  top:7px;
  height:36px;
  min-width:96px;
  padding:0 10px;
  border-radius:10px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(255,255,255,.96);
  color:#c62f6b;
  font-size:17px;
  font-weight:900;
  white-space:nowrap;
  z-index:2;
}
.deluxe #badge{color:#8c2872;background:linear-gradient(180deg,#fff5b6,#fff)}
#lane{
  position:absolute;
  left:112px;
  right:10px;
  top:0;
  height:100%;
  overflow:hidden;
  display:flex;
  align-items:center;
}
#text{
  position:absolute;
  left:100%;
  white-space:nowrap;
  font-size:23px;
  line-height:1;
  font-weight:900;
  color:#fff;
  text-shadow:0 2px 7px rgba(80,0,35,.34);
  will-change:transform;
}
</style>
</head>
<body>
<div id="stage">
  <div id="counterPanel">
    <div id="months" class="num">1546</div>
    <div id="gifts" class="num">395</div>
  </div>
  <div id="marqueeSlot">
    <div id="banner">
      <div id="shine"></div>
      <div id="badge">🎁 50 贈</div>
      <div id="lane"><div id="text"></div></div>
    </div>
  </div>
</div>
<script>
(() => {
  'use strict';
  const OBS_BUILD='20260904-2220-sheet-marquee-v5';
  const UPDATE_CHECK_MS=10000;
  async function checkForPageUpdate(){
    try{
      const probe=new URL(location.href);
      probe.searchParams.set('__obs_update_check',String(Date.now()));
      const r=await fetch(probe.toString(),{cache:'no-store'});
      if(!r.ok)return;
      const html=await r.text();
      const m=html.match(/const OBS_BUILD='([^']+)'/);
      const remoteBuild=m&&m[1];
      if(remoteBuild && remoteBuild!==OBS_BUILD){
        const next=new URL(location.href);
        next.searchParams.set('__obs_build',remoteBuild);
        location.replace(next.toString());
      }
    }catch(_){ }
  }
  setTimeout(checkForPageUpdate,5000);
  setInterval(checkForPageUpdate,UPDATE_CHECK_MS);
  const COUNTER_API='https://script.google.com/macros/s/AKfycbzLet29KonFvVjhxrzf7oM-g-FyfhVkyzYjbRLQtrHeX7zh4KLNXsIbfRdqGnYZuWzzZg/exec?action=stats';
  const months=document.getElementById('months');
  const gifts=document.getElementById('gifts');
  async function updateCounters(){
    try{
      const r=await fetch(COUNTER_API+'&_='+Date.now(),{cache:'no-store'});
      const d=await r.json();
      if(d && d.ok!==false){
        const m=Number(d.subscriptionMonths);
        const g=Number(d.giftSubCount);
        if(Number.isFinite(m)) months.textContent=String(Math.trunc(m));
        if(Number.isFinite(g)) gifts.textContent=String(Math.trunc(g));
      }
    }catch(e){console.error('Counter update failed',e);}
  }
  updateCounters();
  setInterval(updateCounters,5000);
  const MIN_GIFT=50;
  const DELUXE_GIFT=100;
  const IDLE_GRACE_MS=1100;
  const stage=document.getElementById('stage');
  const banner=document.getElementById('banner');
  const badge=document.getElementById('badge');
  const lane=document.getElementById('lane');
  const text=document.getElementById('text');
  const queue=[];
  const seenEventIds=new Set();
  let playing=false;
  let lastEnqueueAt=0;
  const sleep=ms=>new Promise(r=>setTimeout(r,ms));
  function normalize(payload){
    return {
      name:String(payload?.name||payload?.who||'匿名').trim()||'匿名',
      count:Math.max(0,Math.floor(Number(payload?.count??payload?.total??0)||0)),
      eventId:String(payload?.eventId||payload?.id||'').trim()
    };
  }
  function specialText(count){
    if(count===100)return '089457';
    if(count===150)return '香港13太飽';
    if(count>=200)return '全場起飛';
    return '';
  }
  function messageFor({name,count}){
    const pats=Math.floor(count/5);
    const special=specialText(count);
    if(count>=DELUXE_GIFT){
      return `🔥 ${name} 豪擲 ${count} 份訂閱！${special?special+'！':''}海豹拍肚 +${pats} 🔥`;
    }
    return `🎁 ${name} 贈送 ${count} 份訂閱！海豹拍肚 +${pats}！`;
  }
  function setLook(item){
    const deluxe=item.count>=DELUXE_GIFT;
    banner.classList.remove('standard','deluxe','shine-now');
    banner.classList.add(deluxe?'deluxe':'standard');
    badge.textContent=deluxe?`👑 ${item.count} 贈`:`🎁 ${item.count} 贈`;
    text.textContent=messageFor(item);
    void banner.offsetWidth;
    banner.classList.add('shine-now');
  }
  async function playOne(item){
    setLook(item);
    text.style.transition='none';
    text.style.transform='translateX(0)';
    await sleep(70);
    const distance=lane.clientWidth+text.scrollWidth+30;
    const deluxe=item.count>=DELUXE_GIFT;
    const pxPerSecond=deluxe?112:126;
    const duration=Math.max(deluxe?6.2:5.4,distance/pxPerSecond);
    text.style.transition=`transform ${duration}s linear`;
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      text.style.transform=`translateX(-${distance}px)`;
    }));
    await sleep(duration*1000);
  }
  async function waitForTrueIdle(){
    while(true){
      if(queue.length)return false;
      const left=IDLE_GRACE_MS-(Date.now()-lastEnqueueAt);
      if(left<=0)return true;
      await sleep(Math.min(120,left));
    }
  }
  async function drain(){
    if(playing)return;
    playing=true;
    stage.classList.add('active');
    await sleep(580);
    banner.classList.add('show');
    await sleep(430);
    while(true){
      while(queue.length){
        await playOne(queue.shift());
        await sleep(100);
      }
      if(!(await waitForTrueIdle()))continue;
      banner.classList.remove('show');
      await sleep(420);
      if(queue.length){
        banner.classList.add('show');
        await sleep(430);
        continue;
      }
      stage.classList.remove('active');
      await sleep(580);
      if(queue.length){
        stage.classList.add('active');
        await sleep(580);
        banner.classList.add('show');
        await sleep(430);
        continue;
      }
      break;
    }
    playing=false;
    if(queue.length)drain();
  }
  function enqueue(payload){
    const item=normalize(payload);
    if(item.count<MIN_GIFT)return {accepted:false,reason:'below-threshold'};
    if(item.eventId){
      if(seenEventIds.has(item.eventId))return {accepted:false,reason:'duplicate'};
      seenEventIds.add(item.eventId);
      if(seenEventIds.size>500)seenEventIds.delete(seenEventIds.values().next().value);
    }
    lastEnqueueAt=Date.now();
    queue.push(item);
    drain();
    return {accepted:true};
  }
  window.ZoeGiftMarquee={enqueue,getQueue:()=>queue.slice(),isPlaying:()=>playing,messageFor};
  window.addEventListener('message',e=>{
    if(e?.data?.type==='zoebot-gift-marquee')enqueue(e.data);
  });
  const params=new URLSearchParams(location.search);
  const SHEET_ID='14Yv_DyqvCsgQJQ98vZk_IkQ527xLPSVvLaNBnDGcMug';
  const SHEET_NAME='SubscriptionDetail';
  const SHEET_POLL_MS=1200;
  const SHEET_BASELINE_EVENT='7h_M83Kl6F9FAwp2uDZeiO-lUYZFsVLsCMvZ02YbzS8=';
  const SHEET_SEEN_KEY='zoebot-marquee-sheet-seen-v1';
  const SHEET_INIT_KEY='zoebot-marquee-sheet-initialized-v1';
  let sheetBusy=false;
  let sheetTimer=null;
  const sheetSeen=new Set();
  try{
    const saved=JSON.parse(localStorage.getItem(SHEET_SEEN_KEY)||'[]');
    if(Array.isArray(saved)) saved.slice(-300).forEach(x=>sheetSeen.add(String(x)));
  }catch(_){ }
  function saveSheetSeen(){
    try{
      const arr=[...sheetSeen];
      localStorage.setItem(SHEET_SEEN_KEY,JSON.stringify(arr.slice(-300)));
    }catch(_){ }
  }
  function cellValue(cell){
    if(!cell)return '';
    if(cell.v===null||cell.v===undefined)return '';
    return cell.v;
  }
  function parseGiftRows(resp){
    const rows=resp?.table?.rows||[];
    return rows.map(r=>{
      const c=r?.c||[];
      return {
        who:String(cellValue(c[2])||'匿名').trim()||'匿名',
        count:Math.max(0,Math.floor(Number(cellValue(c[3]))||0)),
        eventId:String(cellValue(c[4])||'').trim()
      };
    }).filter(x=>x.eventId);
  }
  function handleSheetRows(items){
    if(!items.length)return;
    const initialized=(()=>{try{return localStorage.getItem(SHEET_INIT_KEY)==='1';}catch(_){return false;}})();
    if(!initialized){
      const marker=items.findIndex(x=>x.eventId===SHEET_BASELINE_EVENT);
      const catchup=marker>=0?items.slice(0,marker):[];
      items.forEach(x=>sheetSeen.add(x.eventId));
      saveSheetSeen();
      try{localStorage.setItem(SHEET_INIT_KEY,'1');}catch(_){ }
      catchup.slice().reverse().forEach(x=>{
        if(x.count>=MIN_GIFT)enqueue({name:x.who,count:x.count,eventId:x.eventId});
      });
      return;
    }
    const fresh=[];
    for(const item of items){
      if(sheetSeen.has(item.eventId))continue;
      sheetSeen.add(item.eventId);
      fresh.push(item);
    }
    if(!fresh.length)return;
    saveSheetSeen();
    fresh.reverse().forEach(x=>{
      if(x.count>=MIN_GIFT)enqueue({name:x.who,count:x.count,eventId:x.eventId});
    });
  }
  async function pollGiftSheet(){
    if(sheetBusy)return;
    sheetBusy=true;
    try{
      const q="select A,B,C,E,I where B = '贈送訂閱' order by A desc limit 60";
      const u=new URL(`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq`);
      u.searchParams.set('sheet',SHEET_NAME);
      u.searchParams.set('headers','1');
      u.searchParams.set('tq',q);
      u.searchParams.set('tqx','out:json');
      u.searchParams.set('_',String(Date.now()));
      const r=await fetch(u.toString(),{cache:'no-store'});
      if(!r.ok)throw new Error(`sheet HTTP ${r.status}`);
      const raw=await r.text();
      const m=raw.match(/google\.visualization\.Query\.setResponse\(([\s\S]*?)\);?\s*$/);
      if(!m)throw new Error('sheet response parse failed');
      const resp=JSON.parse(m[1]);
      if(resp?.status && resp.status!=='ok')throw new Error('sheet query failed');
      handleSheetRows(parseGiftRows(resp));
    }catch(e){
      console.error('Gift sheet poll failed',e);
    }finally{
      sheetBusy=false;
    }
  }
  pollGiftSheet();
  sheetTimer=setInterval(pollGiftSheet,SHEET_POLL_MS);
  if(params.has('testCount')){
    setTimeout(()=>enqueue({
      name:params.get('testName')||'測試觀眾',
      count:params.get('testCount'),
      eventId:'manual-'+Date.now()
    }),500);
  }
  const EMERGENCY_REPLAY_KEY='zoebot-emergency-replay-20260904-2210-v4';
  const emergencyReplay=()=>{
    enqueue({name:'三瓶水',count:100,eventId:'replay-sc2GeP6pHjXN2mjZ9FFTuzKgiWGawrLJDpfnGXLmo68='});
    enqueue({name:'挖洗小盧',count:50,eventId:'replay-eylSiWegB-QUkiX3x_OAvRHYh4SDyujIxauQ1rvYMEQ='});
    enqueue({name:'嵐色',count:50,eventId:'replay-20260904-215740-lanse-50'});
    enqueue({name:'Lemonck',count:200,eventId:'replay-h5a8ds9g6nBQwdA-MQ3UZ4kBwXKrkPgYDv6XBLihG_o='});
    enqueue({name:'獸獸羅德',count:50,eventId:'replay-AL2Cc4SZNDD5PCVAl9pvua2xScdyeqT-ckK5PTNILXI='});
    enqueue({name:'調皮0123',count:150,eventId:'replay-7h_M83Kl6F9FAwp2uDZeiO-lUYZFsVLsCMvZ02YbzS8='});
  };
  try{
    if(localStorage.getItem(EMERGENCY_REPLAY_KEY)!=='done'){
      localStorage.setItem(EMERGENCY_REPLAY_KEY,'done');
      setTimeout(emergencyReplay,2500);
    }
  }catch(_){setTimeout(emergencyReplay,2500);}
  window.addEventListener('beforeunload',()=>{
    if(sheetTimer)clearInterval(sheetTimer);
  });
})();
</script>
</body>
</html>
