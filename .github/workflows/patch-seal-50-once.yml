name: Patch seal 50-1 once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-seal-50-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch formal and test 50-1 to seal
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          media_repl='<div class="tierMedia" data-tier="50" data-variant="1"><video src="seal.mp4?v=fa7babdabdcd" playsinline preload="none"></video></div>'
          old_msg='return`肉乙被 ${name} 逼喝了 ${count}瓶水！電競媽祖保持微笑 :)！海豹拍肚 +${pats}！`;'
          new_msg='return`感謝 ${name} 的 ${count}份贈訂！才藝表演卡祖笛：海豹拍！海豹拍肚 +${pats}！`;'

          for f in ['obs-overlay-core-v16.html','gift-marquee-obs-test.html']:
              p=Path(f)
              s=p.read_text(encoding='utf-8')
              pat=r'<div class="tierMedia" data-tier="50" data-variant="1"(?: data-muted="1")?><video src="(?:3xwater-260|seal)\.mp4(?:\?v=[^"]+)?"(?: muted)? playsinline preload="none"></video></div>'
              s,n=re.subn(pat,media_repl,s,count=1)
              if n!=1:
                  raise SystemExit(f'50-1 media line not found in {f}')
              if old_msg in s:
                  s=s.replace(old_msg,new_msg,1)
              elif new_msg not in s:
                  raise SystemExit(f'50-1 message not found in {f}')
              if f=='obs-overlay-core-v16.html':
                  s,n2=re.subn(r"const OBS_BUILD='[^']+'", "const OBS_BUILD='20260908-0710-production-seal-v21'", s, count=1)
                  if n2!=1: raise SystemExit('core OBS_BUILD not found')
              p.write_text(s,encoding='utf-8')
              print('patched',f)

          p=Path('obs-overlay.html')
          s=p.read_text(encoding='utf-8')
          s,n=re.subn(r"const OBS_BUILD='[^']+';", "const OBS_BUILD='20260908-0710-sheet-variant-seal-v21';", s, count=1)
          if n!=1: raise SystemExit('wrapper OBS_BUILD not found')
          s,n=re.subn(r"const CORE_URL='obs-overlay-core-v16\.html\?v=[^']+';", "const CORE_URL='obs-overlay-core-v16.html?v=20260908-0710-seal';", s, count=1)
          if n!=1: raise SystemExit('CORE_URL not found')
          p.write_text(s,encoding='utf-8')

          p=Path('gift-marquee-test.html')
          s=p.read_text(encoding='utf-8')
          s,n=re.subn(r'<button data-count="50" data-variant="1" data-label="[^"]+">1 [^<]+</button>', '<button data-count="50" data-variant="1" data-label="海豹拍">1 海豹拍</button>', s, count=1)
          if n!=1: raise SystemExit('50-1 test button not found')
          p.write_text(s,encoding='utf-8')
          PY
          grep -n 'data-tier="50" data-variant="1"\|才藝表演卡祖笛：海豹拍\|OBS_BUILD=.*seal\|CORE_URL=.*seal\|1 海豹拍' obs-overlay-core-v16.html obs-overlay.html gift-marquee-obs-test.html gift-marquee-test.html
      - name: Check seal media
        shell: bash
        run: |
          if ! command -v ffprobe >/dev/null 2>&1; then sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; fi
          DURATION=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 seal.mp4)
          AUDIO=$(ffprobe -v error -select_streams a -show_entries stream=codec_name -of default=noprint_wrappers=1:nokey=1 seal.mp4 | head -n1)
          echo "SEAL_DURATION_SECONDS=$DURATION"
          echo "SEAL_AUDIO_CODEC=$AUDIO"
          python3 - "$DURATION" <<'PY'
          import sys
          d=float(sys.argv[1])
          if 4.5 <= d <= 30:
              print(f'MARQUEE_DURATION_SECONDS={max(4.5,d-0.15):.3f}')
              print('MATCH_MODE=video-duration-minus-0.15s')
          else:
              print('MATCH_MODE=natural-text-speed-fallback')
          PY
      - name: Commit patch and remove workflow
        shell: bash
        run: |
          rm -f .github/workflows/patch-seal-50-once.yml
          git config user.name "donson85001"
          git config user.email "donson85001@gmail.com"
          git add -A
          git commit -m "Use seal.mp4 for 50-1 marquee"
          git push
