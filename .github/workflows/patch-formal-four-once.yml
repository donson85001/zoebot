name: Patch formal four variants once
on:
  push:
    paths:
      - '.github/workflows/patch-formal-four-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python3 .github/patch-formal-four.py
      - name: Verify
        run: |
          grep -n "production-four-v25\|data-tier=\"50\" data-variant=\"4\"\|data-tier=\"100\" data-variant=\"4\"\|data-tier=\"150\" data-variant=\"4\"\|data-tier=\"200\" data-variant=\"4\"\|ni.mp4\|sir.mp4\|0725.mp4\|關於cmonBruh的歌\|next<=4\|n===1?4:n-1" obs-overlay-core-v16.html obs-overlay.html
      - name: Commit
        run: |
          rm -f .github/patch-formal-four.py .github/workflows/patch-formal-four-once.yml
          git config user.name donson85001
          git config user.email donson85001@gmail.com
          git add -A
          git commit -m "Promote four-variant marquee to formal"
          git push
