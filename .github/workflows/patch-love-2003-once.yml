name: Patch love 200-3 once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-love-2003-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch formal and test 200-3 plus 50-1 text
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          love_media='<div class="tierMedia" data-tier="200" data-variant="3"><video src="love.mp4?v=2522c09e7b36" playsinline preload="none"></video></div>'
          old_2003='return`${name} 想看肉乙的項鍊 ${count}次！項鍊請問是什麼顏色？海豹拍肚 +${pats}！`'
          new_2003='return`肉乙好想知道${name}的${count}份會給怎樣的人！從不養戀愛粉恩罵~!海豹拍肚 +${pats}！`'
          old_501='return`感謝 ${name} 的 ${count}份贈訂！才藝表演卡祖笛：海豹拍！海豹拍肚 +${pats}！`'
          new_501='return`感謝 ${name} 的 ${count}份贈訂！才藝表演：海豹拍！海豹拍肚 +${pats}！`'

          for f in ['obs-overlay-core-v16.html','gift-marquee-obs-test.html']:
              p=Path(f)
              s=p.read_text(encoding='utf-8')
              pat=r'<div class="tierMedia" data-tier="200" data-variant="3"(?: data-muted="1")?><video src="(?:necklace-520|love)\.mp4(?:\?v=[^"]+)?"(?: muted)? playsinline preload="none"></video></div>'
              s,n=re.subn(pat,love_media,s,count=1)
              if n!=1:
                  raise SystemExit(f'200-3 media line not found in {f}')
              if old_2003 in s:
                  s=s.replace(old_2003,new_2003,1)
              elif new_2003 not in s:
                  raise SystemExit(f'200-3 message not found in {f}')
              if old_501 in s:
                  s=s.replace(old_501,new_501,1)
              elif new_501 not in s:
                  raise SystemExit(f'50-1 message not found in {f}')
              if f=='obs-overlay-core-v16.html':
                  s,n2=re.subn(r"const OBS_BUILD='[^']+'", "const OBS_BUILD='20260908-0800-production-love-v22'", s, count=1)
                  if n2!=1: raise SystemExit('core OBS_BUILD not found')
              p.write_text(s,encoding='utf-8')
              print('patched',f)

          p=Path('obs-overlay.html')
          s=p.read_text(encoding='utf-8')
          s,n=re.subn(r"const OBS_BUILD='[^']+';", "const OBS_BUILD='20260908-0800-sheet-variant-love-v22';", s, count=1)
          if n!=1: raise SystemExit('wrapper OBS_BUILD not found')
          s,n=re.subn(r"const CORE_URL='obs-overlay-core-v16\.html\?v=[^']+';", "const CORE_URL='obs-overlay-core-v16.html?v=20260908-0800-love';", s, count=1)
          if n!=1: raise SystemExit('CORE_URL not found')
          p.write_text(s,encoding='utf-8')

          p=Path('gift-marquee-test.html')
          s=p.read_text(encoding='utf-8')
          s,n=re.subn(r'<button class="v3" data-count="200" data-variant="3" data-label="[^"]+">3 [^<]+</button>', '<button class="v3" data-count="200" data-variant="3" data-label="戀愛粉">3 戀愛粉</button>', s, count=1)
          if n!=1: raise SystemExit('200-3 test button not found')
          p.write_text(s,encoding='utf-8')
          PY
          grep -n 'data-tier="200" data-variant="3"\|戀愛粉恩罵\|才藝表演：海豹拍\|OBS_BUILD=.*love\|CORE_URL=.*love\|3 戀愛粉' obs-overlay-core-v16.html obs-overlay.html gift-marquee-obs-test.html gift-marquee-test.html
      - name: Check love media
        shell: bash
        run: |
          if ! command -v ffprobe >/dev/null 2>&1; then sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; fi
          DURATION=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 love.mp4)
          AUDIO=$(ffprobe -v error -select_streams a -show_entries stream=codec_name -of default=noprint_wrappers=1:nokey=1 love.mp4 | head -n1)
          echo "LOVE_DURATION_SECONDS=$DURATION"
          echo "LOVE_AUDIO_CODEC=$AUDIO"
          python3 - "$DURATION" <<'PY'
          import sys
          d=float(sys.argv[1])
          if 4.5 <= d <= 30:
              print(f'MARQUEE_DURATION_SECONDS={max(4.5,d-0.15):.3f}')
              print('MATCH_MODE=video-duration-minus-0.15s')
          else:
              print('MATCH_MODE=natural-text-speed-fallback')
          PY
      - name: Commit patch and remove workflow
        shell: bash
        run: |
          rm -f .github/workflows/patch-love-2003-once.yml
          git config user.name "donson85001"
          git config user.email "donson85001@gmail.com"
          git add -A
          git commit -m "Use love.mp4 for 200-3 marquee"
          git push
