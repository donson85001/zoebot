name: Patch lemon audio once
on:
  push:
    paths:
      - '.github/workflows/patch-lemon-audio-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch 200-1 to lemon.mp4 with audio
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          targets=['obs-overlay-core-v16.html','gift-marquee-obs-test.html']
          for f in targets:
              p=Path(f)
              s=p.read_text(encoding='utf-8')
              pat=r'<div class="tierMedia" data-tier="200" data-variant="1"(?: data-muted="1")?><video src="(?:cel-780|lemon-780|lemon)\.mp4\?v=[^"]+"(?: muted)? playsinline preload="none"></video></div>'
              repl='<div class="tierMedia" data-tier="200" data-variant="1"><video src="lemon.mp4?v=fb61ff496cff" playsinline preload="none"></video></div>'
              s2,n=re.subn(pat,repl,s,count=1)
              if n!=1:
                  raise SystemExit(f'200-1 media line not found in {f}')
              if f=='obs-overlay-core-v16.html':
                  s2,n2=re.subn(r"const OBS_BUILD='[^']+'", "const OBS_BUILD='20260908-0604-production-lemon-audio-v19'", s2, count=1)
                  if n2!=1: raise SystemExit('core OBS_BUILD not found')
              p.write_text(s2,encoding='utf-8')
              print('patched',f)

          p=Path('obs-overlay.html')
          s=p.read_text(encoding='utf-8')
          s,n=re.subn(r"const OBS_BUILD='[^']+';", "const OBS_BUILD='20260908-0604-sheet-variant-lemon-audio-v19';", s, count=1)
          if n!=1: raise SystemExit('wrapper OBS_BUILD not found')
          s,n=re.subn(r"const CORE_URL='obs-overlay-core-v16\.html\?v=[^']+';", "const CORE_URL='obs-overlay-core-v16.html?v=20260908-0604-lemon-audio';", s, count=1)
          if n!=1: raise SystemExit('CORE_URL not found')
          p.write_text(s,encoding='utf-8')
          PY
          grep -n 'data-tier="200" data-variant="1"\|OBS_BUILD=.*lemon-audio\|CORE_URL=.*lemon-audio' obs-overlay-core-v16.html obs-overlay.html gift-marquee-obs-test.html
      - name: Check lemon media
        shell: bash
        run: |
          if ! command -v ffprobe >/dev/null 2>&1; then sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; fi
          DURATION=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 lemon.mp4)
          AUDIO=$(ffprobe -v error -select_streams a -show_entries stream=codec_name -of default=noprint_wrappers=1:nokey=1 lemon.mp4 | head -n1)
          echo "LEMON_DURATION_SECONDS=$DURATION"
          echo "LEMON_AUDIO_CODEC=$AUDIO"
          python3 - "$DURATION" <<'PY'
          import sys
          d=float(sys.argv[1])
          if 4.5 <= d <= 30:
              print(f'MARQUEE_DURATION_SECONDS={max(4.5,d-0.15):.3f}')
              print('MATCH_MODE=video-duration-minus-0.15s')
          else:
              print('MATCH_MODE=natural-text-speed-fallback')
          PY
          test -n "$AUDIO"
      - name: Commit patch and remove workflow
        shell: bash
        run: |
          rm -f .github/workflows/patch-lemon-audio-once.yml
          git config user.name "donson85001"
          git config user.email "donson85001@gmail.com"
          git add -A
          git commit -m "Use audible lemon.mp4 for 200-1"
          git push
