name: Patch boy 100-1 once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-boy-100-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch formal and test 100-1 to boy
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          media_repl='<div class="tierMedia" data-tier="100" data-variant="1"><video src="boy.mp4?v=2b043d08d737" playsinline preload="none"></video></div>'
          old_msg='if(count>=100)return`肉乙塞給 ${name} ${count}個蛋塔！香港13太飽猴！海豹拍肚 +${pats}！`;'
          new_msg='if(count>=100)return`肉乙跟 ${name} 一起泡泡浴了 ${count}次！果然只有男人最懂男人！海豹拍肚 +${pats}！`;'

          for f in ['obs-overlay-core-v16.html','gift-marquee-obs-test.html']:
              p=Path(f)
              s=p.read_text(encoding='utf-8')
              pat=r'<div class="tierMedia" data-tier="100" data-variant="1"(?: data-muted="1")?><video src="(?:egg-780|boy)\.mp4(?:\?v=[^"]+)?"(?: muted)? playsinline preload="none"></video></div>'
              s,n=re.subn(pat,media_repl,s,count=1)
              if n!=1:
                  raise SystemExit(f'100-1 media line not found in {f}')
              if old_msg not in s:
                  if new_msg not in s:
                      raise SystemExit(f'100-1 old message not found in {f}')
              else:
                  s=s.replace(old_msg,new_msg,1)
              if f=='obs-overlay-core-v16.html':
                  s,n2=re.subn(r"const OBS_BUILD='[^']+'", "const OBS_BUILD='20260908-0711-production-boy-v20'", s, count=1)
                  if n2!=1: raise SystemExit('core OBS_BUILD not found')
              p.write_text(s,encoding='utf-8')
              print('patched',f)

          p=Path('obs-overlay.html')
          s=p.read_text(encoding='utf-8')
          s,n=re.subn(r"const OBS_BUILD='[^']+';", "const OBS_BUILD='20260908-0711-sheet-variant-boy-v20';", s, count=1)
          if n!=1: raise SystemExit('wrapper OBS_BUILD not found')
          s,n=re.subn(r"const CORE_URL='obs-overlay-core-v16\.html\?v=[^']+';", "const CORE_URL='obs-overlay-core-v16.html?v=20260908-0711-boy';", s, count=1)
          if n!=1: raise SystemExit('CORE_URL not found')
          p.write_text(s,encoding='utf-8')

          p=Path('gift-marquee-test.html')
          s=p.read_text(encoding='utf-8')
          s,n=re.subn(r'<button data-count="100" data-variant="1" data-label="[^"]+">1 [^<]+</button>', '<button data-count="100" data-variant="1" data-label="boy">1 boy</button>', s, count=1)
          if n!=1: raise SystemExit('100-1 test button not found')
          p.write_text(s,encoding='utf-8')
          PY
          grep -n 'data-tier="100" data-variant="1"\|一起泡泡浴了\|OBS_BUILD=.*boy\|CORE_URL=.*boy\|1 boy' obs-overlay-core-v16.html obs-overlay.html gift-marquee-obs-test.html gift-marquee-test.html
      - name: Check boy media
        shell: bash
        run: |
          if ! command -v ffprobe >/dev/null 2>&1; then sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; fi
          DURATION=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 boy.mp4)
          AUDIO=$(ffprobe -v error -select_streams a -show_entries stream=codec_name -of default=noprint_wrappers=1:nokey=1 boy.mp4 | head -n1)
          echo "BOY_DURATION_SECONDS=$DURATION"
          echo "BOY_AUDIO_CODEC=$AUDIO"
          python3 - "$DURATION" <<'PY'
          import sys
          d=float(sys.argv[1])
          if 4.5 <= d <= 30:
              print(f'MARQUEE_DURATION_SECONDS={max(4.5,d-0.15):.3f}')
              print('MATCH_MODE=video-duration-minus-0.15s')
          else:
              print('MATCH_MODE=natural-text-speed-fallback')
          PY
      - name: Commit patch and remove workflow
        shell: bash
        run: |
          rm -f .github/workflows/patch-boy-100-once.yml
          git config user.name "donson85001"
          git config user.email "donson85001@gmail.com"
          git add -A
          git commit -m "Use boy.mp4 for 100-1 marquee"
          git push
