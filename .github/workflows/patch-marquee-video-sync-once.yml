name: Patch marquee video sync once
on:
  push:
    paths:
      - '.github/workflows/patch-marquee-video-sync-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync marquee progress to video progress
        run: |
          python3 - <<'PY'
          from pathlib import Path

          formal_sync = ("function fallbackDuration(item,distance){const pxPerSecond=item.count<100?188:172;return Math.max(item.count<100?6.8:7.2,distance/pxPerSecond)}\n" "function runMarqueeSyncedToVideo(item,entry,distance){const video=entry.video,clip=Number(video.duration),start=Math.max(0,Number(video.currentTime)||0);if(!(Number.isFinite(clip)&&clip>start+.05)){const duration=fallbackDuration(item,distance);text.style.transition=`transform ${duration}s linear`;requestAnimationFrame(()=>requestAnimationFrame(()=>text.style.transform=`translateX(-${distance}px)`));return sleep(duration*1000)}text.style.transition='none';return new Promise(resolve=>{let done=false;const span=Math.max(.001,clip-start),finish=()=>{if(done)return;done=true;text.style.transform=`translateX(-${distance}px)`;resolve()},tick=()=>{if(done)return;const now=Math.max(start,Number(video.currentTime)||start),progress=Math.min(1,Math.max(0,(now-start)/span));text.style.transform=`translateX(-${distance*progress}px)`;if(video.ended||now>=clip-.04){finish();return}requestAnimationFrame(tick)};requestAnimationFrame(tick)})}\n" "function waitForVideoFinish(video){if(!video||video.ended)return Promise.resolve();return new Promise(resolve=>{let done=false,poll=0,timer=0;const cleanup=()=>{video.removeEventListener('ended',finish);video.removeEventListener('error',finish);clearInterval(poll);clearTimeout(timer)},finish=()=>{if(done)return;done=true;cleanup();resolve()},check=()=>{const d=Number(video.duration),t=Number(video.currentTime);if(video.ended||(Number.isFinite(d)&&d>0&&Number.isFinite(t)&&t>=d-.04))finish()};video.addEventListener('ended',finish,{once:true});video.addEventListener('error',finish,{once:true});poll=setInterval(check,100);const d=Number(video.duration);timer=setTimeout(finish,Number.isFinite(d)&&d>0?Math.min(90000,Math.max(10000,(d+15)*1000)):45000);check()})}")
          test_sync = ("  function fallbackDuration(item,distance){const pxPerSecond=item.count<100?188:172;return Math.max(item.count<100?6.8:7.2,distance/pxPerSecond)}\n" "  function runMarqueeSyncedToVideo(item,entry,distance){const video=entry.video,clip=Number(video.duration),start=Math.max(0,Number(video.currentTime)||0);if(!(Number.isFinite(clip)&&clip>start+.05)){const duration=fallbackDuration(item,distance);text.style.transition=`transform ${duration}s linear`;requestAnimationFrame(()=>requestAnimationFrame(()=>text.style.transform=`translateX(-${distance}px)`));return sleep(duration*1000)}text.style.transition='none';return new Promise(resolve=>{let done=false;const span=Math.max(.001,clip-start),finish=()=>{if(done)return;done=true;text.style.transform=`translateX(-${distance}px)`;resolve()},tick=()=>{if(done)return;const now=Math.max(start,Number(video.currentTime)||start),progress=Math.min(1,Math.max(0,(now-start)/span));text.style.transform=`translateX(-${distance*progress}px)`;if(video.ended||now>=clip-.04){finish();return}requestAnimationFrame(tick)};requestAnimationFrame(tick)})}\n" "  function waitForVideoFinish(video){if(!video||video.ended)return Promise.resolve();return new Promise(resolve=>{let done=false,poll=0,timer=0;const cleanup=()=>{video.removeEventListener('ended',finish);video.removeEventListener('error',finish);clearInterval(poll);clearTimeout(timer)},finish=()=>{if(done)return;done=true;cleanup();resolve()},check=()=>{const d=Number(video.duration),t=Number(video.currentTime);if(video.ended||(Number.isFinite(d)&&d>0&&Number.isFinite(t)&&t>=d-.04))finish()};video.addEventListener('ended',finish,{once:true});video.addEventListener('error',finish,{once:true});poll=setInterval(check,100);const d=Number(video.duration);timer=setTimeout(finish,Number.isFinite(d)&&d>0?Math.min(90000,Math.max(10000,(d+15)*1000)):45000);check()})}")

          p=Path('obs-overlay-core-v16.html'); s=p.read_text(encoding='utf-8')
          assert "const OBS_BUILD='20260909-1748-production-fullclip-v26'" in s
          s=s.replace("const OBS_BUILD='20260909-1748-production-fullclip-v26'","const OBS_BUILD='20260909-1800-production-videosync-v27'",1)
          a=s.index('function durationFor(item,entry,distance){'); b=s.index('\nconst SHEET_ID=',a); s=s[:a]+formal_sync+s[b:]
          old="async function playOne(item){const entry=entryFor(item.count,item.variant,item.mediaAlt);await switchMedia(entry);setLook(item);text.style.transition='none';text.style.transform='translateX(0)';await sleep(70);const distance=lane.clientWidth+text.scrollWidth+54,duration=durationFor(item,entry,distance),videoDone=waitForVideoFinish(entry.video);text.style.transition=`transform ${duration}s linear`;requestAnimationFrame(()=>requestAnimationFrame(()=>text.style.transform=`translateX(-${distance}px)`));await Promise.all([sleep(duration*1000),videoDone]);if(!queue.length)hideActive()}"
          new="async function playOne(item){const entry=entryFor(item.count,item.variant,item.mediaAlt);await switchMedia(entry);setLook(item);text.style.transition='none';text.style.transform='translateX(0)';await sleep(70);const distance=lane.clientWidth+text.scrollWidth+54,videoDone=waitForVideoFinish(entry.video),marqueeDone=runMarqueeSyncedToVideo(item,entry,distance);await Promise.all([marqueeDone,videoDone]);if(!queue.length)hideActive()}"
          assert old in s; s=s.replace(old,new,1); p.write_text(s,encoding='utf-8')

          p=Path('gift-marquee-obs-test.html'); s=p.read_text(encoding='utf-8')
          a=s.index('  function durationFor(item,entry,distance){'); b=s.index('\n  async function playOne(item){',a); s=s[:a]+test_sync+s[b:]
          old="  async function playOne(item){\n    const entry=entryFor(item.count,item.variant);if(!entry)return;await switchMedia(entry);setLook(item);\n    text.style.transition='none';text.style.transform='translateX(0)';await sleep(70);\n    const distance=lane.clientWidth+text.scrollWidth+54,duration=durationFor(item,entry,distance),videoDone=waitForVideoFinish(entry.video);\n    text.style.transition=`transform ${duration}s linear`;requestAnimationFrame(()=>requestAnimationFrame(()=>text.style.transform=`translateX(-${distance}px)`));\n    await Promise.all([sleep(duration*1000),videoDone]);\n    if(!queue.length)hideActive();\n  }"
          new="  async function playOne(item){\n    const entry=entryFor(item.count,item.variant);if(!entry)return;await switchMedia(entry);setLook(item);\n    text.style.transition='none';text.style.transform='translateX(0)';await sleep(70);\n    const distance=lane.clientWidth+text.scrollWidth+54,videoDone=waitForVideoFinish(entry.video),marqueeDone=runMarqueeSyncedToVideo(item,entry,distance);\n    await Promise.all([marqueeDone,videoDone]);\n    if(!queue.length)hideActive();\n  }"
          assert old in s; s=s.replace(old,new,1); p.write_text(s,encoding='utf-8')

          p=Path('obs-overlay.html'); s=p.read_text(encoding='utf-8')
          assert "const OBS_BUILD='20260909-1748-sheet-fullclip-v26'" in s and "const CORE_URL='obs-overlay-core-v16.html?v=20260909-1748-fullclip'" in s
          s=s.replace("const OBS_BUILD='20260909-1748-sheet-fullclip-v26'","const OBS_BUILD='20260909-1800-sheet-videosync-v27'",1).replace("const CORE_URL='obs-overlay-core-v16.html?v=20260909-1748-fullclip'","const CORE_URL='obs-overlay-core-v16.html?v=20260909-1800-videosync'",1)
          p.write_text(s,encoding='utf-8')

          for html in ['obs-overlay-core-v16.html','gift-marquee-obs-test.html']:
              s=Path(html).read_text(encoding='utf-8'); assert s.count('class="tierMedia"')==16; assert 'runMarqueeSyncedToVideo' in s; assert 'marqueeDone=runMarqueeSyncedToVideo' in s; assert 'Promise.all([marqueeDone,videoDone])' in s; assert 'return Math.max(natural,remaining+.2)' not in s
          print('Verified formal/test marquee follows video currentTime and reaches the end with the video.')
          PY
      - name: Commit
        run: |
          rm -f .github/workflows/patch-marquee-video-sync-once.yml
          git config user.name donson85001
          git config user.email donson85001@gmail.com
          git add -A
          git commit -m "Sync marquee speed to video playback"
          git push
